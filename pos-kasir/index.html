<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARFUM SARJANA – POS</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --panel: #ffffff; --ink: #000000; --mute: #6b7280; --line: #e5e7eb;
  --acc: #facc15; --accink: #000000; --warn: #ea580c; --bad: #ef4444; --soft: #f9fafb;
}
body.login-mode { --bg: #000000; --panel: #111111; --ink: #ffffff; --mute: #9ca3af; --line: #333333; --soft: #222222; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; min-height: 100vh; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px; background: #000; color: #fff; border-bottom: 1px solid #333; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; margin-right: 12px; color: #fff; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button, .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 8px 16px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; transition: all .2s; }
header nav button, header .chip { color: #fff; border-color: #333; }
nav button[aria-current="true"], .chip[aria-pressed="true"], header nav button[aria-current="true"] { background: var(--acc); color: var(--accink); border-color: var(--acc); }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }

.pos { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
.kasir-pos > aside { position: sticky; top: calc(var(--hdr, 64px) + 12px); max-height: calc(100vh - var(--hdr, 64px) - 24px); display: flex; flex-direction: column; }
.kasir-pos > aside #items-section { flex: 1 1 auto; min-height: 120px; overflow-y: auto; padding-right: 4px; }
.kasir-pos > aside .cart-foot { flex: none; }
.cart-pop-items { max-height: 50vh; overflow-y: auto; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.05); }

input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; transition: border-color .2s; }
textarea { resize: vertical; min-height: 60px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); }
input[type=checkbox] { width: auto; accent-color: #000; }
label { display: block; font-size: 13px; color: var(--mute); font-weight: 600; margin-bottom: 6px; }
.form-group { margin-bottom: 16px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; min-width: 140px; }
.chk { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-weight: 600; color: var(--ink); font-size: 14px; margin: 0; cursor: pointer; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type=search], .toolbar input[type=text] { flex: 1; min-width: 160px; width: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--acc); }
.filterbox { background: var(--soft); padding: 16px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 20px; }
.filterbox h3 { margin: 0 0 12px; font-size: 14px; }

.item { text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 14px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 6px; min-height: 110px; transition: all .2s; }
.item:hover { border-color: var(--acc); transform: translateY(-2px); }
.item b { font-weight: 700; font-size: 15px; }
.item .p { font-weight: 800; margin-top: auto; font-size: 16px; color: var(--warn); }
.item small { color: var(--mute); font-size: 12px; }
.plist { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.prow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; font: inherit; transition: all .2s; }
.prow:hover { border-color: var(--acc); }
.prow small { display: block; color: var(--mute); font-size: 12px; }
.prow .p { font-weight: 800; color: var(--warn); }
.prow .plus { width: 30px; height: 30px; border-radius: 8px; background: var(--acc); display: grid; place-items: center; font-weight: 800; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; }
.big { font-size: 20px; font-weight: 800; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.qty { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.qty button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); font-size: 18px; cursor: pointer; }
.hr { border-top: 1px dashed var(--line); margin: 12px 0; }

.btn { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 10px 16px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.pri { background: var(--acc); color: var(--accink); border-color: var(--acc); }
.btn.pri:hover { opacity: .9; }
.btn.del { color: #fff; background: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 13px; color: var(--mute); font-weight: 700; background: var(--soft); }
td.n, th.n { text-align: right; white-space: nowrap; }
.wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.wrap table { margin-top: 0; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--mute); flex-wrap: wrap; }
.pager div { display: flex; gap: 8px; align-items: center; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
.stat { background: var(--soft); border-radius: 10px; padding: 16px; border: 1px solid var(--line); }
.stat span { font-size: 13px; color: var(--mute); font-weight: 600; }
.stat b { display: block; font-size: 24px; font-weight: 800; margin-top: 4px; }

.tag { font-size: 11px; padding: 4px 8px; border-radius: 99px; background: var(--soft); color: var(--ink); font-weight: 700; text-transform: uppercase; }
.tag.bad { background: #fee2e2; color: #b91c1c; }
.empty { color: var(--mute); padding: 30px 10px; text-align: center; }
h2 { margin: 0 0 16px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }

dialog { border: none; border-radius: 16px; background: var(--panel); color: var(--ink); max-width: 440px; width: 92%; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,.1); max-height: 92vh; overflow: auto; }
dialog.wide { max-width: 680px; }
dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
.dlg-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 8px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); display: none; z-index: 9999; }

/* Struk */
.rcpt { font-family: "Courier New", monospace; font-size: 13px; }
.rcpt .rc-title { text-align: center; font-weight: 800; font-size: 18px; letter-spacing: -.5px; }
.rcpt .rc-sub, .rcpt .rc-meta, .rcpt .rc-foot { text-align: center; color: var(--mute); font-size: 12px; margin-top: 4px; }
.rcpt .row { align-items: flex-start; padding: 3px 0; }
.rc-box { background: #fff; color: #000; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.rc-box .rc-sub, .rc-box .rc-meta, .rc-box .rc-foot { color: #444; }

/* ===== Header & navigasi ===== */
header { position: sticky; top: 0; z-index: 50; gap: 10px 14px; padding: 10px 20px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); align-items: center; }
header .brand { margin-right: 4px; white-space: nowrap; }
header nav { flex: 1; min-width: 0; }
header .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
header .hdr-right .tag { background: #222; color: #fff; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
header .chip { padding: 7px 14px; white-space: nowrap; }
nav button .ic { display: none; }
.chips { -webkit-overflow-scrolling: touch; }
.seg button, .chip, .btn, nav button { touch-action: manipulation; }
.hdr-user { display: inline; }
#mbar { display: none; }

/* ===== Tablet (<= 1024px) ===== */
@media (max-width: 1024px) {
  main { padding: 16px; }
  .pos:not(.kasir-pos) { grid-template-columns: 1fr !important; gap: 16px; }
  .kasir-pos { grid-template-columns: 1fr 320px; gap: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  header { padding-left: 16px; padding-right: 16px; }
  header nav button { padding: 8px 12px; }
  .panel { padding: 16px; }
}

/* ===== Smartphone (<= 720px) ===== */
@media (max-width: 720px) {
  body { font-size: 14px; padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  body.login-mode { padding-bottom: 0; }
  main { padding: 12px; }
  header { padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); flex-wrap: nowrap; }
  header .brand { font-size: 15px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  header .hdr-right { gap: 6px; }
  header .hdr-right .tag { font-size: 10px; max-width: 110px; padding: 4px 8px; }
  header .chip { padding: 6px 10px; font-size: 13px; }
  .hdr-user { display: none; }
  header nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0;
    background: #000; border-top: 1px solid #333; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  header nav button { border: 0; border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; min-height: 50px; color: #9ca3af; }
  header nav button .ic { display: block; font-size: 19px; line-height: 1; }
  header nav button[aria-current="true"] { background: transparent; color: var(--acc); border: 0; }

  h2 { font-size: 18px; margin-bottom: 12px; }
  .panel { padding: 14px; border-radius: 12px; }
  input, select, textarea { font-size: 16px; padding: 11px 12px; }
  #mq { font-size: 16px !important; padding: 10px !important; }
  .btn { padding: 11px 14px; min-height: 42px; }
  .btn.sm { padding: 8px 12px; min-height: 36px; }
  .form-row { flex-direction: column; gap: 0; }
  .form-row > * { min-width: 0; margin-bottom: 12px; }
  .toolbar { gap: 8px; }
  .toolbar > .btn { flex: 1 1 calc(50% - 8px); }
  .toolbar > input[type=search], .toolbar > input[type=text] { flex: 1 1 100%; min-width: 0; }

  .chips { flex-wrap: nowrap; overflow-x: auto; margin-left: -2px; padding: 2px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .chip { flex: 0 0 auto; padding: 8px 14px; }
  #pmethods, #quick-cash { flex-wrap: wrap; overflow: visible; }
  #pmethods .chip { flex: 1 1 calc(50% - 8px); text-align: center; }
  .seg button { padding: 9px 12px; }

  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .item { padding: 12px; min-height: 100px; }
  .item b { font-size: 14px; }
  .prow { gap: 8px; padding: 10px; }
  .prow .plus { width: 34px; height: 34px; }
  .qty button { width: 38px; height: 38px; }

  .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { padding: 12px; }
  .stat b { font-size: 18px; }
  th, td { padding: 10px 8px; font-size: 13px; }
  .pager { justify-content: center; }
  .pager > span { width: 100%; text-align: center; }
  .pager div { width: 100%; justify-content: space-between; }

  dialog { width: 100%; max-width: 100% !important; margin: auto 0 0 0; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; }
  dialog.wide { max-width: 100% !important; }
  .dlg-actions { position: sticky; bottom: -2px; background: var(--panel); padding-top: 12px; flex-wrap: nowrap; }
  .dlg-actions .btn { flex: 1; }
  #toast { left: 12px; right: 12px; transform: none; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); text-align: center; }

  #mbar { display: flex; align-items: center; gap: 10px; position: fixed; left: 8px; right: 8px; z-index: 55; bottom: calc(68px + env(safe-area-inset-bottom, 0px));
    background: #111; color: #fff; border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .kasir-pos { grid-template-columns: 1fr !important; }
  .kasir-pos > aside { display: none; }
  #mbar .mcart { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: transparent; border: 0; color: #fff; text-align: left; padding: 0; font: inherit; cursor: pointer; }
  #mbar .cico { position: relative; width: 42px; height: 42px; border-radius: 12px; background: #262626; display: grid; place-items: center; font-size: 22px; flex: none; }
  #mbar .cbadge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid #111; line-height: 1; }
  #mbar .cbadge[hidden] { display: none; }
  #mbar .mi { flex: 1; min-width: 0; line-height: 1.25; }
  #mbar .mi small { display: block; color: #9ca3af; font-size: 11px; }
  #mbar .mi b { font-size: 16px; }
  #mbar .btn { padding: 10px 16px; }
  body:has(#mbar) { padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px)); }
  .login-wrap { margin: 6vh auto 0 !important; }
}
@media (max-width: 380px) {
  .grid { gap: 8px; }
  header .brand { font-size: 14px; }
  header nav button { font-size: 10px; }
}
</style>
</head>
<body class="login-mode">

<header id="main-header" style="display:none">
  <span class="brand">PARFUM SARJANA</span>
  <nav id="nav" aria-label="Menu utama"></nav>
  <div class="hdr-right" id="hdr-right"></div>
</header>

<main>
  <div id="view"></div>
</main>

<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc as fsGetDoc, getDocs, setDoc, deleteDoc, collection, query, where, orderBy, limit, onSnapshot, writeBatch, increment, Timestamp, documentId, arrayUnion, arrayRemove, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { firebaseConfig, emailDomain, adminEmail } from "./config.js";

const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app);

// ---------- UTILS ----------
const $ = s => document.querySelector(s);
const rp = n => "Rp " + Math.round(n || 0).toLocaleString("id-ID");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => typeof v === "number" ? v : (+String(v == null ? "" : v).replace(/[^\d-]/g, "") || 0);

let toastTimeout;
function toast(m) {
  const t = $("#toast"); t.textContent = m; t.style.display = "block";
  clearTimeout(toastTimeout); toastTimeout = setTimeout(() => t.style.display = "none", 3200);
}
function modal(html, wide = false, id = "dlg") {
  const dl = $("#" + id);
  if (dl.open) dl.close();
  dl.className = wide ? "wide" : ""; dl.innerHTML = html; dl.showModal(); return dl;
}
function customConfirm(msg, onYes) {
  modal(`<h3 style="margin-top:0">Konfirmasi</h3>
    <p style="color:var(--mute)">${esc(msg)}</p>
    <div class="dlg-actions"><button class="btn" data-close="1">Batal</button><button class="btn pri" id="btn-yes">Ya, Lanjutkan</button></div>`, false, "dlg2");
  $("#btn-yes").onclick = () => { $("#dlg2").close(); onYes(); };
}

// ---------- KONFIGURASI & STATE ----------
const PAGE = 20;
const PERMS = [
  ["jual", "Transaksi kasir"],
  ["pelanggan", "Melihat pelanggan"],
  ["pelanggan_kelola", "Edit & hapus pelanggan"],
  ["laporan", "Melihat laporan"],
  ["riwayat", "Melihat riwayat transaksi"],
  ["lengkap", "Melihat semua cabang & periode lama"],
  ["riwayat_batal", "Membatalkan transaksi"],
  ["produk_kelola", "Kelola produk (tambah, edit, hapus, Excel)"],
  ["kategori_kelola", "Kelola kategori"],
  ["struk_kelola", "Edit template struk"],
  ["stok", "Stok & Opname: lihat riwayat, tambah/kurangi stok, stok opname"],
  ["stok_kelola", "Stok: ekspor riwayat & migrasi stok lama"]
];
const DEF_BRANCHES = [{ key: "ums", name: "Parfum Sarjana UMS", active: true }, { key: "uns", name: "Parfum Sarjana UNS", active: true }];
const DEF_ROLES = { kasir: { name: "Kasir", perms: { jual: true, pelanggan: true, laporan: true, riwayat: true } } };
const DEF_RECEIPT = {
  title: "PARFUM SARJANA", sub: "", footer: "Terima kasih sudah berbelanja di Parfum Sarjana!", paper: "58",
  showBranch: true, showAddress: true, showInvoice: true, showDate: true, showKasir: true, showMember: true, showUnitPrice: true, showDiscount: true, showPayment: true
};
const RC_TOGGLES = [["showBranch","Nama cabang"],["showAddress","Alamat cabang"],["showInvoice","Nomor invoice"],["showDate","Tanggal & jam"],["showKasir","Nama kasir"],["showMember","Data pelanggan"],["showUnitPrice","Harga satuan per item"],["showDiscount","Baris diskon"],["showPayment","Metode bayar, nominal & kembalian"]];
const METHODS = ["Tunai", "QRIS", "Debit", "Transfer"];
const RANGES = [["hari","Hari ini"],["kemarin","Kemarin"],["7","7 hari"],["30","30 hari"],["bulan","Bulan ini"],["lalu","Bulan lalu"]];
const LEGACY_BR = { "Parfum Sarjana UMS": "ums", "Parfum Sarjana UNS": "uns" };

const S = {
  me: null, admin: false, all: false, tab: "kasir", setTab: "produk",
  products: [], cats: [], staff: [], members: [], daily: null, sales: null, salesMap: {}, purchases: null,
  branches: DEF_BRANCHES, roles: DEF_ROLES, receipt: { ...DEF_RECEIPT }, qris: "",
  cart: {}, q: "", cat: "Semua", disc: 0, method: "Tunai", paid: "", vm: localStorage.getItem("ps_vm") || "grid",
  member: null, mres: [], editingId: null, pfCat: "Semua", pfQ: "", sel: new Set(),
  vRange: "hari", pSearch: "", viewMember: null, hf: { from: "", to: "", prod: "" },
  fKasir: "Semua", fBranch: "", fCat: "Semua", fProd: "", rK: "Semua", rC: "Semua", rP: "",
  pg: {}, cur: null, imp: null,
  stk: { view: "hist", from: "", to: "", br: "Semua", prod: "", type: "", kat: "", logs: null, q: "", cat: "Semua", sel: new Set(), ft: "in" }
};
const can = p => S.admin || !!(S.me && S.roles[S.me.role] && S.roles[S.me.role].perms && S.roles[S.me.role].perms[p]);
const roleName = id => id === "admin" ? "Admin" : ((S.roles[id] && S.roles[id].name) || id);
const stockOf = (p, bk = S.me && S.me.bk) => { const v = p && p.stockBy && p.stockBy[bk]; return typeof v === "number" ? v : 0; };
const brShort = b => String(b.name || b.key).replace(/^parfum sarjana\s*/i, "") || b.name;
const stockInfoHTML = p => S.branches.map(b => { const v = stockOf(p, b.key); return `<div style="white-space:nowrap">${esc(brShort(b))}: ${v < 0 ? `<span class="tag bad">${v}</span>` : `<b>${v}</b>`}</div>`; }).join("");
const bkOf = s => s.bk || (S.branches.find(b => b.name === s.branch) || {}).key || LEGACY_BR[s.branch];

const getCol = c => collection(db, c);
const getDoc = (c, id) => doc(db, c, String(id));
const ts = ms => Timestamp.fromMillis(ms);
const sod = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const dkey = ms => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const dd = (t, by, sg, total, n, method, items) => ({
  day: dkey(t), dayTs: ts(sod(t)), by,
  revenue: increment(sg * total), count: increment(sg), qty: increment(sg * n),
  methods: { [method]: increment(sg * total) },
  prod: Object.fromEntries(items.map(i => [i.id, { n: i.name, c: i.c || "", q: increment(sg * i.q), r: increment(sg * i.price * i.q) }]))
});

function paginate(arr, key, size = PAGE) {
  const pages = Math.max(1, Math.ceil(arr.length / size));
  const p = Math.min(Math.max(S.pg[key] || 1, 1), pages);
  S.pg[key] = p;
  const pager = !arr.length ? "" : `<div class="pager"><span>${arr.length} data</span><div>
    <button class="btn sm" data-pg="${key}" data-to="${p-1}" ${p <= 1 ? "disabled" : ""}>‹ Sebelumnya</button>
    <span>Hal ${p} / ${pages}</span>
    <button class="btn sm" data-pg="${key}" data-to="${p+1}" ${p >= pages ? "disabled" : ""}>Berikutnya ›</button></div></div>`;
  return { items: arr.slice((p-1) * size, p * size), pager };
}

// Cache seluruh pelanggan agar bisa dicari bebas (nama mana pun / potongan nomor HP, mis. 4 digit akhir).
let memCache = null, memAt = 0;
const memInval = () => { memAt = 0; };
async function allMembers() {
  if (memCache && Date.now() - memAt < 120000) return memCache;
  const s = await getDocs(getCol("members"));
  memCache = s.docs.map(d => ({ id: d.id, ...d.data() }));
  memAt = Date.now();
  return memCache;
}
async function findMembers(q) {
  const all = await allMembers();
  const tokens = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const byName = (a, b) => String(a.name).localeCompare(String(b.name));
  if (!tokens.length) return all.slice().sort(byName).slice(0, 300);
  return all.filter(m => {
    const name = String(m.name || "").toLowerCase(), phone = String(m.phone || m.id || "").replace(/\D/g, "");
    return tokens.every(t => name.includes(t) || (/^\d+$/.test(t) && phone.includes(t)));
  }).sort(byName);
}

async function loadData() {
  const tab = S.tab;
  if (tab !== "laporan" && tab !== "riwayat") return;
  const [f, t] = getRange(S.all ? S.vRange : "hari");
  const br = S.all ? S.fBranch : S.me.branch;
  const keys = (br === "Semua" || !br ? S.branches.map(b => b.key) : [(S.branches.find(b => b.name === br) || {}).key]).filter(Boolean);
  if (tab === "laporan") S.daily = null; else S.sales = null;
  view();
  try {
    if (tab === "laporan") {
      const r = await Promise.all(keys.map(k => getDocs(query(collection(db, "branches", k, "daily"), where("dayTs", ">=", ts(f)), where("dayTs", "<", ts(t))))));
      S.daily = r.flatMap((s, i) => s.docs.map(d => ({...d.data(), id: d.id, bk: keys[i], dayTs: d.data().dayTs.toMillis()})));
    } else {
      const r = await Promise.all(keys.map(k => getDocs(query(collection(db, "branches", k, "sales"), where("ts", ">=", ts(f)), where("ts", "<", ts(t)), orderBy("ts", "desc"), limit(300)))));
      S.sales = r.flatMap(s => s.docs.map(d => ({...d.data(), id: d.id, ts: d.data().ts.toMillis()}))).sort((a, b) => b.ts - a.ts);
      S.sales.forEach(x => S.salesMap[x.id] = x);
      S.pg.rw = 1;
    }
  } catch(e) { toast("Gagal memuat: " + errMsg(e)); if (tab === "laporan") S.daily = []; else S.sales = []; }
  if (S.tab === tab) view();
}

async function loadStaff() {
  try {
    const s = await getDocs(getCol("users"));
    S.staff = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => String(a.username).localeCompare(String(b.username)));

}

function go(t) {

  else if (t === "stok") loadStock();

}
function getRange(k) {
  const t = new Date(); t.setHours(0,0,0,0);
  const d = t.getTime(), y = t.getFullYear(), m = t.getMonth();
  if (k === "hari") return [d, d + 864e5];
  if (k === "kemarin") return [d - 864e5, d];
  if (k === "7") return [d - 6 * 864e5, d + 864e5];
  if (k === "30") return [d - 29 * 864e5, d + 864e5];
  if (k === "bulan") return [new Date(y, m, 1).getTime(), d + 864e5];
  return [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()];
}

const branchAddr = s => ((S.branches.find(b => (s.bk && b.key === s.bk) || b.name === s.branch) || {}).address || "").trim();
function receiptHTML(s, t = S.receipt) {
  const addr = t.showAddress ? branchAddr(s) : "";
  const meta = [
    t.showBranch && esc(s.branch), addr && esc(addr).replace(/\n/g, "<br>"), t.showInvoice && esc(s.id),
    t.showDate && new Date(s.ts).toLocaleString("id-ID"), t.showKasir && "Kasir: " + esc(s.by),
    t.showMember && s.member && ("Plg: " + esc(s.member.name) + (s.member.phone ? " (" + esc(s.member.phone) + ")" : ""))
  ].filter(Boolean).join("<br>");
  return `<div class="rcpt">
    <div class="rc-title">${esc(t.title)}</div>
    ${t.sub ? `<div class="rc-sub">${esc(t.sub).replace(/\n/g, "<br>")}</div>` : ""}
    ${meta ? `<div class="rc-meta">${meta}</div>` : ""}
    <div class="hr"></div>
    ${s.items.map(i => `<div class="row"><span>${i.qty}× ${esc(i.name)}${t.showUnitPrice ? `<br><small style="color:#666">@ ${rp(i.price)}</small>` : ""}</span><b>${rp(i.price * i.qty)}</b></div>`).join("")}
    <div class="hr"></div>

    <div class="row" style="font-weight:800;font-size:15px"><span>Total</span><b>${rp(s.total)}</b></div>

    ${t.footer ? `<div class="hr"></div><div class="rc-foot">${esc(t.footer).replace(/\n/g, "<br>")}</div>` : ""}
  </div>`;
}
function receiptText(s, t = S.receipt) {
  const L = ["*" + t.title + "*"];
  if (t.sub) L.push(t.sub);
  if (t.showBranch) L.push("*" + s.branch + "*");
  if (t.showAddress && branchAddr(s)) L.push(branchAddr(s));
  if (t.showInvoice) L.push("Nota: " + s.id);
  if (t.showDate) L.push(new Date(s.ts).toLocaleString("id-ID"));
  if (t.showKasir) L.push("Kasir: " + s.by);
  L.push("");
  s.items.forEach(i => L.push(`${i.qty}x ${i.name}${t.showUnitPrice ? " @" + rp(i.price) : ""} = ${rp(i.price * i.qty)}`));
  L.push("");
  if (t.showDiscount && s.discount) L.push("Diskon: -" + rp(s.discount));
  L.push("*Total: " + rp(s.total) + "*");
  if (t.showPayment) L.push(`Bayar (${s.method}): ${rp(s.paid)}`, "Kembalian: " + rp(s.change));
  if (t.footer) L.push("", t.footer);
  return L.join("\n");
}

async function processCheckout() {
  const d = getCartData();
  if (!d.lines.length) return toast("Keranjang kosong!");
  const paid = S.method === "Tunai" ? (+S.paid || 0) : d.total;
  if (paid < d.total) return toast("Uang diterima kurang!");
  $("#pay").disabled = true; $("#pay").textContent = "Memproses...";
  try {
    const now = Date.now(), bk = S.me.bk, day = dkey(now), by = S.me.username;
    const saleId = "INV" + day.slice(2).replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
    const items = d.lines.map(l => ({ id: l.id, name: l.name, c: l.category || "", price: l.price, qty: l.qty, note: l.stock - l.qty < 0 ? "stok minus" : null }));
    const m = S.member ? { id: S.member.id, name: S.member.name, phone: S.member.phone } : null;
    const sale = { ts: ts(now), day, branch: S.me.branch, bk, by, member: m, items, subtotal: d.sub, discount: d.disc, total: d.total, method: S.method, paid, change: paid - d.total };
    const b = writeBatch(db);
    b.set(doc(db, "branches", bk, "sales", saleId), sale);
    d.lines.forEach((l, i) => {
      b.update(getDoc("products", l.id), { ["stockBy." + bk]: increment(-l.qty) });
      b.set(doc(db, "branches", bk, "stockLogs", "L" + saleId + "-" + i), { ts: ts(now), bk, branch: S.me.branch, pid: l.id, pname: l.name, sku: l.sku || "", type: "out", qty: l.qty, before: l.stock, after: l.stock - l.qty, by, note: "Penjualan " + saleId, src: "penjualan", cat: "penjualan", ref: saleId });
    });
    b.set(doc(db, "branches", bk, "daily", day + "_" + by), dd(now, by, 1, d.total, d.lines.reduce((a, l) => a + l.qty, 0), S.method, items.map(i => ({...i, q: i.qty}))), { merge: true });
    if (m) {
      b.set(getDoc("members", m.id), { spend: increment(d.total), visits: increment(1) }, { merge: true });
      b.set(doc(db, "members", m.id, "purchases", saleId), sale);
    }
    await b.commit(); memInval();
    S.cart = {}; S.disc = 0; S.paid = ""; S.member = null; S.mres = []; S.q = ""; S.method = "Tunai";
    showNota({ id: saleId, ...sale, ts: now });
    vKasir();
  } catch(e) {
    toast("Gagal: " + errMsg(e));
    if ($("#pay")) { $("#pay").disabled = false; $("#pay").textContent = "Bayar"; }
  }
}

function voidSale(id) {
  const s = S.salesMap[id];
  if (!s) return;
  if (!can("riwayat_batal")) return toast("Anda tidak punya izin membatalkan transaksi");
  customConfirm(`Batalkan transaksi ${id}? Stok akan dikembalikan.`, async () => {
    try {
      const bk = bkOf(s), by = s.by, n = s.items.reduce((a, i) => a + i.qty, 0);
      if (!bk) return toast("Cabang transaksi tidak ditemukan");
      const items = s.items.map(i => ({ id: i.id, name: i.name, c: i.c, price: i.price, q: i.qty }));
      const b = writeBatch(db);
      b.delete(doc(db, "branches", bk, "sales", id));
      s.items.forEach((i, k) => {
        const p = S.products.find(x => x.id === i.id); if (!p) return; const bf = stockOf(p, bk);
        b.update(getDoc("products", i.id), { ["stockBy." + bk]: increment(i.qty) });
        b.set(doc(db, "branches", bk, "stockLogs", "V" + id + "-" + k), { ts: ts(Date.now()), bk, branch: brName(bk), pid: i.id, pname: i.name, sku: p.sku || "", type: "in", qty: i.qty, before: bf, after: bf + i.qty, by: S.me.username, note: "Pembatalan " + id, src: "penjualan", cat: "penjualan", ref: id });
      });
      b.set(doc(db, "branches", bk, "daily", s.day + "_" + by), dd(s.ts, by, -1, s.total, n, s.method, items), { merge: true });
      if (s.member) {
        b.set(getDoc("members", s.member.id), { spend: increment(-s.total), visits: increment(-1) }, { merge: true });
        b.delete(doc(db, "members", s.member.id, "purchases", id)); memInval();
      }
      await b.commit(); $("#dlg").close(); toast("Transaksi dibatalkan"); loadData();
    } catch(e) { toast("Gagal membatalkan: " + errMsg(e)); }
  });
}

const okItem = p => (S.fCat === "Semua" || p.c === S.fCat) && (!S.fProd || String(p.n).toLowerCase().includes(S.fProd.toLowerCase()));
function reportCalc() {
  let docs = S.daily || [];
  if (S.fKasir !== "Semua") docs = docs.filter(x => x.by === S.fKasir);
  const itemFilter = S.fCat !== "Semua" || !!S.fProd, byItem = {}, pm = {};
  let totalRev = 0, totalItems = 0, count = 0;
  docs.forEach(x => {
    if (!itemFilter) {
      totalRev += x.revenue || 0; count += x.count || 0; totalItems += x.qty || 0;
      Object.entries(x.methods || {}).forEach(([m, v]) => pm[m] = (pm[m] || 0) + v);
    }
    Object.values(x.prod || {}).forEach(p => {
      if (!okItem(p)) return;
      byItem[p.n] = byItem[p.n] || { q: 0, r: 0 };
      byItem[p.n].q += p.q; byItem[p.n].r += p.r;
      if (itemFilter) { totalRev += p.r; totalItems += p.q; }
    });
  });
  const all = Object.entries(byItem).filter(e => e[1].q > 0).sort((a, b) => b[1].r - a[1].r);
  return { docs, itemFilter, pm, totalRev, totalItems, count, all, top: all.slice(0, 10), methods: Object.entries(pm).filter(e => e[1] > 0) };
}

async function applyMassEdit() {
  const cat = $("#me-cat").value, pm = $("#me-pm").value, pvS = $("#me-pv").value;
  if (pm !== "keep" && pvS === "") return toast("Isi nilai harga");
  if (cat === "__keep" && pm === "keep") return toast("Tidak ada perubahan yang dipilih");
  const pv = +pvS, list = S.products.filter(p => S.sel.has(p.id));
  const btn = $("#me-save"); btn.disabled = true; btn.textContent = "Memproses...";
  try {
    await chunked(list, (b, p) => {
      const u = {};
      if (cat !== "__keep") u.category = cat === "__none" ? "" : cat;
      if (pm === "set") u.price = Math.max(0, Math.round(pv));
      else if (pm === "pct") u.price = Math.max(0, Math.round(p.price * (1 + pv / 100)));
      else if (pm === "add") u.price = Math.max(0, Math.round(p.price + pv));
      b.update(getDoc("products", p.id), u);
    });
    $("#dlg").close(); toast(`${list.length} produk diperbarui`); view();
  } catch(e) { toast("Gagal: " + errMsg(e)); btn.disabled = false; btn.textContent = "Terapkan"; }
}

let XLSXM = null;
async function xl() {
  if (XLSXM) return XLSXM;
  let m;
  try { m = await import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs"); }
  catch { m = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm"); }
  return XLSXM = m.utils ? m : m.default;
}

async function parseImport(file) {
  const prev = $("#imp-prev"); prev.innerHTML = `<div class="empty" style="padding:10px">Membaca file…</div>`; $("#imp-go").disabled = true;
  try {
    const X = await xl();
    const wb = X.read(await file.arrayBuffer(), { type: "array" });
    const raw = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    const alias = { id: ["id", "idproduk"], sku: ["sku", "kode", "kodesku"], name: ["nama", "namaproduk", "name", "produk", "namaparfum"], category: ["kategori", "category"], price: ["harga", "price", "hargajual"] };
    const rows = new Map(), errs = [];
    raw.forEach((r, i) => {
      const o = {};
      Object.entries(r).forEach(([k, v]) => { const nk = String(k).toLowerCase().replace(/[^a-z]/g, ""); for (const f in alias) if (alias[f].includes(nk)) o[f] = v; });
      const name = String(o.name || "").trim(), sku = String(o.sku || "").trim(), id = String(o.id || "").trim();
      if (!name && !sku && !id && o.price === undefined) return;
      if (!name) return errs.push(`Baris ${i + 2}: nama kosong`);
      if (o.price === undefined || o.price === "") return errs.push(`Baris ${i + 2} (${name}): harga kosong`);
      const price = num(o.price);
      if (price < 0) return errs.push(`Baris ${i + 2} (${name}): harga negatif`);
      rows.set(id || (sku ? "sku:" + sku.toLowerCase() : "row" + i), { id, sku, name, category: String(o.category || "").trim(), price });
    });
    const byId = new Map(S.products.map(p => [p.id, p])), bySku = new Map(S.products.filter(p => p.sku).map(p => [String(p.sku).toLowerCase(), p]));
    const list = [...rows.values()].map(r => ({ ...r, ex: byId.get(r.id) || (r.sku && bySku.get(r.sku.toLowerCase())) || null }));
    S.imp = { list, errs };
    const nNew = list.filter(r => !r.ex).length, nEx = list.length - nNew;
    prev.innerHTML = `<div class="stat" style="margin-bottom:10px"><span>Hasil pembacaan</span><b style="font-size:16px">${list.length} baris valid · ${nNew} baru · ${nEx} sudah ada</b></div>
      ${errs.length ? `<div style="color:var(--bad); font-size:13px; margin-bottom:10px">${errs.length} baris dilewati:<br>${errs.slice(0, 5).map(esc).join("<br>")}${errs.length > 5 ? "<br>…" : ""}</div>` : ""}
      ${list.length ? `<div class="wrap" style="max-height:220px; overflow:auto"><table><thead><tr><th>SKU</th><th>Nama</th><th>Kategori</th><th class="n">Harga</th><th>Status</th></tr></thead><tbody>
        ${list.slice(0, 10).map(r => `<tr><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td class="n">${rp(r.price)}</td><td>${r.ex ? "Ada" : "Baru"}</td></tr>`).join("")}
      </tbody></table></div>${list.length > 10 ? `<small style="color:var(--mute)">Menampilkan 10 dari ${list.length} baris.</small>` : ""}` : ""}`;
    $("#imp-go").disabled = !list.length;
  } catch(e) { prev.innerHTML = `<div style="color:var(--bad)">Gagal membaca file: ${esc(errMsg(e))}</div>`; }
}
async function runImport() {
  if (!S.imp || !S.imp.list.length) return;
  const skip = $("#imp-mode").value === "skip", btn = $("#imp-go");
  const list = S.imp.list.filter(r => !(skip && r.ex));
  if (!list.length) return toast("Tidak ada produk baru untuk diimpor");
  btn.disabled = true; btn.textContent = "Mengimpor...";
  try {
    const base = Date.now();
    await chunked(list, (b, r, i) => {
      const data = { name: r.name, sku: r.sku, category: r.category, price: r.price };
      b.set(getDoc("products", r.ex ? r.ex.id : "P" + base + "x" + i), data, { merge: true });
    });
    const newCats = [...new Set(list.map(r => r.category).filter(c => c && !S.cats.some(x => x.id === c)))];
    if (newCats.length) await setDoc(doc(db, "meta", "categories"), { list: arrayUnion(...newCats) }, { merge: true });
    $("#dlg").close(); toast(`${list.length} produk berhasil diimpor`); view();
  } catch(e) { toast("Gagal impor: " + errMsg(e)); btn.disabled = false; btn.textContent = "Impor"; }
}

async function renameKategori(old, id) {
  if (id === old) { $("#dlg").close(); return; }
  if (S.cats.some(c => c.id.toLowerCase() === id.toLowerCase() && c.id !== old)) return toast("Nama kategori sudah ada");
  const btn = $("#fc-add"); if (btn) { btn.disabled = true; btn.textContent = "Menyimpan..."; }
  try {
    const inUse = S.products.filter(p => p.category === old);
    for (let i = 0; i < inUse.length; i += 450) {
      const b = writeBatch(db);
      inUse.slice(i, i + 450).forEach(p => b.update(getDoc("products", p.id), { category: id }));
      await b.commit();
    }
    const list = S.cats.map(c => c.id === old ? id : c.id);
    await setDoc(doc(db, "meta", "categories"), { list }, { merge: true });
    if (S.pfCat === old) S.pfCat = id;
    if (S.cat === old) S.cat = id;
    if (S.rC === old) S.rC = id;
    if (S.fCat === old) S.fCat = id;
    $("#dlg").close(); toast("Kategori diperbarui"); view();
  } catch(e) { toast("Gagal: " + errMsg(e)); if (btn) { btn.disabled = false; btn.textContent = "Simpan"; } }
}
async function saveKategori(old = "") {
  const id = $("#fc-name").value.trim();
  if (!id || id.length > 40) return toast("Nama kategori wajib diisi (maks. 40 huruf)");
  if (old) return renameKategori(old, id);

    </div>`;

function fileToQris(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      let q = .92, d = c.toDataURL("image/jpeg", q);
      while (d.length > 800000 && q > .4) { q -= .1; d = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(url); res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Gambar tidak dapat dibaca")); };
    img.src = url;
  });
}
async function uploadQris(file) {
  try {
    const data = await fileToQris(file);
    await setDoc(doc(db, "meta", "qris"), { data }); S.qris = data; toast("Gambar QRIS disimpan"); rSetQris();

async function loadStock() {

    st.logs = r.flatMap((sn, i) => sn.docs.map(d => ({ ...d.data(), id: d.id, bk: d.data().bk || keys[i], ts: d.data().ts.toMillis() }))).sort((a, b) => b.ts - a.ts);

// Semua perubahan stok lewat sini: update saldo cabang + catat riwayat (siapa, kapan, sebelum/sesudah).
async function applyStock(entries, src = "manual") {
  const now = Date.now(), by = S.me.username, run = new Map(), ops = [];
  entries.forEach(e => {
    const key = e.p.id + "|" + e.bk, before = run.has(key) ? run.get(key) : stockOf(e.p, e.bk);
    const delta = e.type === "in" ? e.qty : e.type === "out" ? -e.qty : e.qty - before;
    if (!delta && e.cat !== "opname") return;
    run.set(key, before + delta); ops.push({ e, before, delta });
  });
  for (let i = 0; i < ops.length; i += 200) {
    const b = writeBatch(db);
    ops.slice(i, i + 200).forEach((o, j) => {
      const e = o.e, id = "S" + now + "-" + (i + j) + "-" + Math.random().toString(36).slice(2, 5);
      if (o.delta || e.legacy) b.update(getDoc("products", e.p.id), { ["stockBy." + e.bk]: increment(o.delta), ...(e.legacy ? { stock: deleteField() } : {}) });
      b.set(doc(db, "branches", e.bk, "stockLogs", id), { ts: ts(now), bk: e.bk, branch: brName(e.bk), pid: e.p.id, pname: e.p.name, sku: e.p.sku || "", type: o.delta > 0 ? "in" : "out", qty: Math.abs(o.delta), before: o.before, after: o.before + o.delta, by, note: e.note || (e.type === "set" ? (e.cat === "opname" ? "Stok fisik hasil opname: " : "Atur stok menjadi ") + e.qty : ""), src, cat: e.cat || "penyesuaian" });
    });
    await b.commit();
  }
  return ops.length;
}

const OP = { bk: "", q: "", vals: {}, note: "" };
const opBk = () => (OP.bk && stkBrs().some(b => b.key === OP.bk) ? OP.bk : (stkBrs().find(b => b.key === S.me.bk) || stkBrs()[0] || {}).key);
const opList = () => { const q = OP.q.trim().toLowerCase(); return S.products.filter(p => !q || (p.name + " " + (p.sku || "")).toLowerCase().includes(q)); };
function opDiff(p) { const v = OP.vals[opBk() + "|" + p.id]; return v === undefined || v === "" ? null : Math.round(+v) - stockOf(p, opBk()); }
function vOpname() {
  const brs = stkBrs(), bk = opBk();
  $("#view").innerHTML = `
    <div class="panel">
      <h2>Stok Opname ${S.all ? "" : "— " + esc(S.me.branch)}</h2>
      <p style="color:var(--mute); margin-top:-8px">Isi stok real hasil hitung. Selisih dihitung otomatis terhadap stok di sistem. Produk yang dikosongkan dilewati. Saat disimpan, stok di sistem diganti dengan stok real dan tercatat di Riwayat Stok.</p>
      <div class="filterbox"><div class="form-row" style="flex-wrap:wrap">
        ${S.all && brs.length > 1 ? `<div class="form-group" style="margin:0"><label>Cabang</label><select id="op-br">${brs.map(b => `<option value="${esc(b.key)}" ${b.key === bk ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select></div>` : ""}
        <div class="form-group" style="margin:0"><label>Cari produk</label><input id="op-q" placeholder="Nama / SKU..." value="${esc(OP.q)}"></div>
        <div class="form-group" style="margin:0"><label>Catatan (opsional)</label><input id="op-n" maxlength="120" placeholder="mis. Opname akhir bulan" value="${esc(OP.note)}"></div></div></div>
      <div id="op-sum" class="stats"></div>
      <div class="wrap"><table><thead><tr><th>Produk</th><th class="n">Stok Sistem</th><th style="width:120px">Stok Real</th><th class="n">Selisih</th></tr></thead><tbody id="op-body"></tbody></table></div>
      <div id="op-pager"></div>
      <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px"><button class="btn" data-opclr="1">Kosongkan isian</button><button class="btn pri" id="op-save">Simpan Hasil Opname</button></div>
    </div>`;
  renderOpBody();
}
function renderOpBody() {
  const tb = $("#op-body"); if (!tb) return;
  const { items, pager } = paginate(opList(), "op", 30), bk = opBk();
  tb.innerHTML = items.length ? items.map(p => `<tr data-opr="${esc(p.id)}"><td><b>${esc(p.name)}</b><br><small style="color:var(--mute)">${esc(p.sku || "")}</small></td><td class="n os"></td>
    <td><input type="number" step="1" min="0" inputmode="numeric" data-opv="${esc(p.id)}" value="${esc(OP.vals[bk + "|" + p.id] ?? "")}" style="padding:8px"></td><td class="n od"></td></tr>`).join("") : `<tr><td colspan="4" class="empty">Produk tidak ditemukan.</td></tr>`;
  $("#op-pager").innerHTML = pager; updOp();
}
function updOp() {
  const bk = opBk(); let plus = 0, minus = 0, n = 0, same = 0;
  S.products.forEach(p => { const d = opDiff(p); if (d === null) return; n++; if (d > 0) plus += d; else if (d < 0) minus += d; else same++; });
  document.querySelectorAll("[data-opr]").forEach(tr => {
    const p = S.products.find(x => x.id === tr.dataset.opr); if (!p) return;
    const d = opDiff(p), c = tr.querySelector(".od");
    tr.querySelector(".os").textContent = stockOf(p, bk);
    c.textContent = d === null ? "-" : (d > 0 ? "+" : "") + d; c.style.color = d > 0 ? "#166534" : d < 0 ? "var(--bad)" : "inherit"; c.style.fontWeight = "800";
  });
  const el = $("#op-sum");
  if (el) el.innerHTML = `<div class="stat"><span>Produk dihitung</span><b>${n}</b></div><div class="stat"><span>Selisih lebih (+)</span><b style="color:#166534">+${plus}</b></div><div class="stat"><span>Selisih kurang (−)</span><b style="color:var(--bad)">${minus}</b></div><div class="stat"><span>Sesuai</span><b>${same}</b></div>`;
}
function saveOpname() {
  const bk = opBk(), note = OP.note.trim();
  const ents = S.products.filter(p => opDiff(p) !== null).map(p => ({ p, bk, type: "set", qty: Math.round(+OP.vals[bk + "|" + p.id]), cat: "opname", note }));
  if (!ents.length) return toast("Isi stok real minimal satu produk");
  if (ents.some(x => isNaN(x.qty) || x.qty < 0)) return toast("Stok real tidak boleh negatif");
  const ch = ents.filter(x => x.qty !== stockOf(x.p, bk)).length;
  customConfirm(`Terapkan opname ${brName(bk)} untuk ${ents.length} produk (${ch} berselisih)? Stok di sistem akan diganti dengan stok real.`, async () => {
    try { await applyStock(ents, "opname"); ents.forEach(x => delete OP.vals[bk + "|" + x.p.id]); toast("Opname disimpan, stok disesuaikan"); renderOpBody(); }
    catch (err) { toast("Gagal: " + errMsg(err)); }
  });
}

  else if (d.stkexp) exportStock();
  else if (d.stkmig) openMigrate();
  else if (t.id === "mg-go") runMigrate();
  else if (d.memexp) exportMembers();
  else if (d.memexp1) exportMemberHistory();
  else if (d.pfcat) { S.pfCat = d.pfcat; S.pg.sprod = 1; rSetProduk(); }
  else if (d.void) voidSale(d.void);
  else if (d.close) { const dl = t.closest("dialog"); if (dl) dl.close(); }

  // Kasir
  else if (d.vm) { S.vm = d.vm; localStorage.setItem("ps_vm", d.vm); S.pg.kasir = 1; vKasir(); }
  else if (d.cat) { S.cat = d.cat; S.pg.kasir = 1; renderCats(); renderGrid(); }
  else if (d.add) { S.cart[d.add] = (S.cart[d.add] || 0) + 1; renderCart(); }
  else if (d.dec) { if (S.cart[d.dec]) { S.cart[d.dec]--; if (S.cart[d.dec] <= 0) delete S.cart[d.dec]; } renderCart(); }
  else if (d.m) { S.method = d.m; renderPay(); }
  else if (d.q) { S.paid = d.q; $("#paid").value = d.q; updateChange(getCartData().total); }
  else if (t.id === "clr" || d.clr) { S.cart = {}; S.disc = 0; S.paid = ""; S.member = null; S.mres = []; renderCart(); }
  else if (t.id === "mkorder" || d.mk) openPayment();
  else if (t.id === "pay") processCheckout();

  // Pelanggan di popup pembayaran
  else if (d.nomem) { S.member = null; renderMemberSelection(); }
  else if (d.pick) { S.member = S.mres[+d.pick]; S.mres = []; renderMemberSelection(); }
  else if (d.newmem) openNewMember(m => { S.member = m; renderMemberSelection(); });

  // Menu Pelanggan
  else if (d.newmemtab) openNewMember(async () => { S.members = await findMembers(S.pSearch); view(); });
  else if (d.editmem) editMemberModal(d.editmem);
  else if (d.viewmem) openMember(d.viewmem);
  else if (d.closemem) { S.viewMember = null; view(); }
  else if (t.id === "fm-save") saveMember(d.mid);
  else if (t.id === "fm-del") delMember(d.mid);

  // Produk
  else if (d.newprod) openProductForm("");
  else if (d.editprod) openProductForm(d.editprod);
  else if (t.id === "fp-save") saveProduct(d.pid);
  else if (d.delprod) delProduct(d.delprod);
  else if (d.massedit) openMassEdit();
  else if (t.id === "me-save") applyMassEdit();
  else if (d.massdel) delSelected();
  else if (d.expxl) exportProducts();
  else if (d.impxl) openImport();
  else if (d.tpl) downloadTemplate();
  else if (t.id === "imp-go") runImport();

  // Kategori
  else if (d.newcat) openCatForm("");
  else if (t.id === "fc-add") saveKategori(d.old || "");
  else if (d.editcat) openCatForm(d.editcat);
  else if (d.delcat) delKategori(d.delcat);

  // Cabang & role
  else if (d.newbr) openBranchForm("");
  else if (d.editbr) openBranchForm(d.editbr);
  else if (t.id === "fb-save") saveBranch(d.key);
  else if (d.newrole) openRoleForm("");
  else if (d.editrole) openRoleForm(d.editrole);
  else if (t.id === "fr-save") saveRole(d.rid);

  // Staff
  else if (d.newstaff) openStaffForm("");
  else if (d.editstaff) openStaffForm(d.editstaff);
  else if (t.id === "fs-save") saveStaff(d.sid);
  else if (d.delstaff) delStaff(d.delstaff);

  // Struk & QRIS
  else if (t.id === "rc-save") saveRc();
  else if (t.id === "rc-reset") { S.receipt = { ...DEF_RECEIPT }; rSetStruk(); toast("Dikembalikan ke default (klik Simpan untuk menerapkan)"); }
  else if (t.id === "qr-del") customConfirm("Hapus gambar QRIS yang tersimpan?", async () => {
    try { await deleteDoc(doc(db, "meta", "qris")); S.qris = ""; toast("Dihapus"); rSetQris(); } catch(err) { toast("Gagal: " + errMsg(err)); }
  });

  // Nota & cabang login
  else if (d.shownota) { const s = S.salesMap[d.shownota]; if (s) showNota(s, can("riwayat_batal") && S.tab === "riwayat"); }
  else if (d.wa) sendWA(S.cur);
  else if (d.print) printNota(S.cur);
  else if (d.br) startApp(S.pick.me, S.pick.list[+d.br]);
  else if (t.id === "br-out") doLogout();
});

document.addEventListener("input", e => {
  const el = e.target, id = el.id;
  if (el.dataset.sel) {
    el.checked ? S.sel.add(el.dataset.sel) : S.sel.delete(el.dataset.sel); updSelUI();
  } else if (id === "sel-all") {
    prodFiltered().forEach(p => el.checked ? S.sel.add(p.id) : S.sel.delete(p.id)); renderProdTable();
  }
  else if (id === "sk-prod") { S.stk.prod = el.value; S.pg.slog = 1; renderStkBody(); }
  else if (id === "sk-type") { S.stk.type = el.value; S.pg.slog = 1; renderStkBody(); }
  else if (id === "sk-kat") { S.stk.kat = el.value; S.pg.slog = 1; renderStkBody(); }
  else if (el.dataset.sfq) { S.stk.fq[el.dataset.sfq] = Math.round(+el.value) || 0; cntSf(); }
  else if (id === "sf-q" || id === "sf-br") fillSf();
  else if (el.dataset.opv) { OP.vals[opBk() + "|" + el.dataset.opv] = el.value; updOp(); }
  else if (id === "op-q") { OP.q = el.value; S.pg.op = 1; renderOpBody(); }
  else if (id === "op-n") OP.note = el.value;
  else if (id === "q") { S.q = el.value; S.pg.kasir = 1; renderGrid(); }
  else if (id === "disc") { S.disc = +el.value || 0; renderCart(); renderPay(); }
  else if (id === "paid") { S.paid = el.value; updateChange(getCartData().total); }
  else if (id === "mq") searchMem(el.value);
  else if (id === "p-search") { S.pSearch = el.value; searchPelanggan(); }
  else if (id === "hf-from") { S.hf.from = el.value; S.pg.hist = 1; renderHist(); }
  else if (id === "hf-to") { S.hf.to = el.value; S.pg.hist = 1; renderHist(); }
  else if (id === "hf-prod") { S.hf.prod = el.value; S.pg.hist = 1; renderHist(); }
  else if (id === "rw-k") { S.rK = el.value; S.pg.rw = 1; renderRwBody(); }
  else if (id === "rw-c") { S.rC = el.value; S.pg.rw = 1; renderRwBody(); }
  else if (id === "rw-p") { S.rP = el.value; S.pg.rw = 1; renderRwBody(); }
  else if (id === "pf-q") { S.pfQ = el.value; S.pg.sprod = 1; renderProdTable(); }
  else if (id.startsWith("rc-")) updRcPrev();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "fc-name") { e.preventDefault(); $("#fc-add").click(); } });
document.addEventListener("change", e => {
  const cid = e.target.id;
  if (cid === "sk-from" || cid === "sk-to") { S.stk[cid === "sk-from" ? "from" : "to"] = e.target.value; loadStock(); return; }
  if (cid === "op-br") { OP.bk = e.target.value; renderOpBody(); return; }
  if (cid === "sk-br") { S.stk.br = e.target.value; loadStock(); return; }
  if (e.target.id === "imp-file" && e.target.files[0]) parseImport(e.target.files[0]);
  else if (e.target.id === "qr-file" && e.target.files[0]) uploadQris(e.target.files[0]);
});

// LOGIN & SESI
// ==========================================
function showLogin(msg = "") {
  document.body.classList.add("login-mode");
  $("#main-header").style.display = "none";
  const eMsg = msg ? `<div style="color:var(--warn); margin-bottom:16px; padding:10px; background:rgba(234,88,12,.1); border-radius:8px; border:1px solid rgba(234,88,12,.3)">${esc(msg)}</div>` : "";
  $("#view").innerHTML = `
    <div class="login-wrap" style="max-width:380px; margin:10vh auto; text-align:center">
      <h1 style="font-weight:800; font-size:28px; margin-bottom:4px; letter-spacing:-1px">PARFUM SARJANA</h1>
      <p style="color:var(--mute); margin-bottom:28px">Point of Sale (POS)</p>
      <div class="panel" style="text-align:left">
        ${eMsg}
        <button class="btn" id="lgg" style="width:100%; padding:13px; font-size:15px; background:#fff; color:#111; border-color:#fff; margin-bottom:6px">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Masuk dengan Google (Admin)</button>
        <div style="display:flex; align-items:center; gap:10px; color:var(--mute); font-size:12px; margin:14px 0"><span style="flex:1; border-top:1px solid var(--line)"></span>atau login kasir<span style="flex:1; border-top:1px solid var(--line)"></span></div>
        <div class="form-group"><label>Username</label><input id="lu" autocomplete="username" placeholder="Masukkan username"></div>
        <div class="form-group" style="margin-bottom:24px"><label>Password</label><input id="lp" type="password" autocomplete="current-password" placeholder="Masukkan password"></div>
        <button class="btn pri" id="lg" style="width:100%; padding:14px; font-size:16px">Masuk Aplikasi</button>
      </div>
    </div>`;
  const attemptLogin = async () => {
    const u = $("#lu").value.trim().toLowerCase(), p = $("#lp").value;
    if (!u || !p) return;
    $("#lg").disabled = true; $("#lg").textContent = "Memeriksa...";
    try {
      const cr = await signInWithEmailAndPassword(auth, u.includes("@") ? u : u + "@" + emailDomain, p);
      await afterAuth(cr.user, false);
    } catch(e) { showLogin(errMsg(e)); }
  };
  $("#lg").onclick = attemptLogin;
  $("#lgg").onclick = async () => {
    const b = $("#lgg"); b.disabled = true;
    const prov = new GoogleAuthProvider(); prov.setCustomParameters({ prompt: "select_account" });
    try {
      let cr;
      try { cr = await signInWithPopup(auth, prov); }
      catch(e) { if (e.code === "auth/popup-blocked") { await signInWithRedirect(auth, prov); return; } throw e; }
      await afterAuth(cr.user, false);
    } catch(e) { showLogin(errMsg(e)); }
  };
  $("#lp").onkeydown = e => { if (e.key === "Enter") attemptLogin(); };
}

// Peran, cabang, dan role dibaca dari Firestore setelah login.
async function loadMe(user) {
  const owner = isOwner(user);
  let me;
  if (owner) me = { uid: user.uid, username: user.email, role: "admin", owner: true };
  else {
    const s = await fsGetDoc(doc(db, "users", user.uid));
    if (!s.exists() || s.data().active === false) {
      await signOut(auth);
      throw new Error(s.exists() ? "Akun dinonaktifkan." : (user.providerData.some(p => p.providerId === "google.com") ? "Akun Google ini belum terdaftar. Hubungi admin." : "Akun belum diberi peran. Hubungi admin."));
    }
    me = { uid: user.uid, username: s.data().username || user.email.split("@")[0], role: s.data().role, branches: s.data().branches || [] };
  }
  const [b, r] = await Promise.all([fsGetDoc(doc(db, "meta", "branches")), fsGetDoc(doc(db, "meta", "roles"))]);
  S.branches = b.exists() ? (b.data().list || DEF_BRANCHES) : DEF_BRANCHES;
  S.roles = r.exists() ? (r.data().map || {}) : DEF_ROLES;
  if (me.role === "admin") {
    const seeds = [];
    if (!b.exists()) seeds.push(setDoc(doc(db, "meta", "branches"), { list: DEF_BRANCHES }));
    if (!r.exists()) seeds.push(setDoc(doc(db, "meta", "roles"), { map: DEF_ROLES }));
    await Promise.all(seeds).catch(() => {});
  }
  return me;
}
async function afterAuth(user, restore) {
  const me = await loadMe(user);
  const all = me.role === "admin" || !!(S.roles[me.role] && S.roles[me.role].perms && S.roles[me.role].perms.lengkap);
  const list = S.branches.filter(b => b.active !== false && (all || (me.branches || []).includes(b.key)));
  if (!list.length && !all) { await signOut(auth); throw new Error("Akun ini belum ditugaskan ke cabang. Hubungi admin."); }
  if (!list.length) { await signOut(auth); throw new Error("Belum ada cabang aktif. Hubungi admin."); }
  const saved = localStorage.getItem("ps_branch"), pre = restore && list.find(b => b.key === saved);
  if (pre) startApp(me, pre);
  else if (list.length === 1) startApp(me, list[0]);
  else showBranchPicker(me, list);
}
function showBranchPicker(me, list) {
  document.body.classList.add("login-mode");
  $("#main-header").style.display = "none";
  S.pick = { me, list };
  $("#view").innerHTML = `
    <div style="max-width:380px; margin:10vh auto; text-align:center">
      <h1 style="font-weight:800; font-size:28px; margin-bottom:4px; letter-spacing:-1px">PARFUM SARJANA</h1>
      <p style="color:var(--mute); margin-bottom:24px">Halo, ${esc(me.username)}. Pilih cabang tempat Anda bertugas.</p>
      <div class="panel" style="display:grid; gap:10px">
        ${list.map((b, i) => `<button class="btn pri" data-br="${i}" style="padding:14px">${esc(b.name)}</button>`).join("")}
        <button class="btn" id="br-out">Keluar</button>
      </div>
    </div>`;
}
async function doLogout() {
  unsubscribers.forEach(u => u());
  localStorage.removeItem("ps_branch");
  await signOut(auth);
  location.reload();
}
function startApp(me, br) {
  document.body.classList.remove("login-mode");
  $("#main-header").style.display = "flex";
  localStorage.setItem("ps_branch", br.key);
  S.me = { ...me, branch: br.name, bk: br.key }; S.admin = me.role === "admin"; S.fBranch = br.name;
  S.all = can("lengkap");
  const ok = allowedTabs(); S.tab = ok.length ? ok[0][0] : "kasir";

  const hr = $("#hdr-right"); hr.innerHTML = "";
  const branchTag = document.createElement("span");
  branchTag.className = "tag"; branchTag.textContent = br.name; branchTag.title = br.name;
  const outBtn = document.createElement("button");
  outBtn.className = "chip";
  outBtn.innerHTML = `Keluar<span class="hdr-user"> <b style="color:var(--acc)">(${esc(me.username)})</b></span>`;
  outBtn.onclick = doLogout;
  hr.append(branchTag, outBtn);
  subscribeData();
  nav(); view();
}

getRedirectResult(auth).catch(() => {});
const firstAuth = new Promise(r => { const off = onAuthStateChanged(auth, u => { off(); r(u); }); });
(async () => {
  const user = await firstAuth;
  if (user) { try { await afterAuth(user, true); } catch(e) { showLogin(errMsg(e)); } }
  else showLogin();
})();
</script>
