// ---------- Voice ----------
const num=s=>{s=s.toLowerCase();let m=s.match(/(\d+(?:[.,]\d+)?)\s*(juta|jt|ribu|rb|k)?/);if(!m)return 0;
 let n=parseFloat(m[1].replace(/\./g,"").replace(",","."));if(/^\d+[.,]\d+$/.test(m[1])&&/[.]/.test(m[1])&&m[2]){n=parseFloat(m[1].replace(",","."))}
 const u=m[2];return u=="juta"||u=="jt"?n*1e6:u?n*1e3:n};
function fillFrom(t,l){const low=t.toLowerCase(),f=S.st.map(s=>({s,i:low.indexOf(s.name.toLowerCase())})).filter(x=>x.i>=0).sort((a,b)=>a.i-b.i);
 M.note=t;const a=num(low);if(a)M.amt=a;
 if(f.length>=2||/\b(pindah|transfer|ambil)\b/.test(low)&&f.length){M.type="tf";const ke=low.indexOf(" ke ");
  let src=f[0].s,dst=f[1]?.s;if(/\bdari\b/.test(low)&&f.length>1){const di=low.indexOf("dari");f.sort((x,y)=>Math.abs(x.i-di)-Math.abs(y.i-di));}
  if(f.length>1&&ke>0){src=f.filter(x=>x.i<ke)[0]?.s||src;dst=f.filter(x=>x.i>ke)[0]?.s||dst}M.st=src.id;if(dst)M.to=dst.id;M.cat=null;}
 else{M.type=/\b(terima|gaji|masuk|dapat|pemasukan|omzet|terjual)\b/.test(low)?"in":"out";if(f[0])M.st=f[0].s.id;
  const cs=M.type=="in"?S.inc:S.exp,hit=cs.find(c=>low.includes(c.name.toLowerCase()))||(M.type=="out"?guess(low):null);
  M.cat=hit?.id||cs[0]?.id;const h=hit?.subs?.find(s=>low.includes(s.toLowerCase()));M.sub=h||""}
 form();$("#ns").textContent=l+" Lengkapi yang belum sesuai."}
function guess(l){const map=[[/makan|nasi|kopi|resto|warung|minum/,"Makan"],[/jajan|snack|es |cemilan/,"Jajan"],[/wifi|listrik|kontrakan|kur|cicilan|tagihan|pulsa/,"Tagihan"],[/bahan|botol|ongkir|packing|iklan|stok/,"Bisnis"],[/bulanan|belanja|galon|gas/,"Bulanan"]];
 for(const[r,n]of map)if(r.test(l))return S.exp.find(c=>c.name==n)}
window.voice=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("Browser tidak mendukung voice. Pakai Chrome/Safari terbaru.");
 const x=new R();x.lang="id-ID";$("#ns").textContent="🎙️ Mendengarkan...";x.onresult=e=>fillFrom(e.results[0][0].transcript,"Terdengar: “"+e.results[0][0].transcript+"”.");
 x.onerror=()=>$("#ns").textContent="Voice gagal, coba lagi.";x.start()};
// ---------- Struk (OCR) ----------
window.scan=async f=>{if(!f)return;$("#ns").textContent="Membaca struk...";
 try{if(!window.Tesseract)await new Promise((a,b)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js";s.onload=a;s.onerror=b;document.head.append(s)});
  const{data}=await Tesseract.recognize(f,"ind"),tx=data.text,lines=tx.split("\n");
  let tot=0;for(const L of lines)if(/total|jumlah|bayar|grand/i.test(L)){const ns=[...L.matchAll(/\d[\d.,]{2,}/g)].map(x=>parseInt(x[0].replace(/[.,]/g,""))).filter(Boolean);if(ns.length)tot=Math.max(tot,...ns)}
  if(!tot){const ns=[...tx.matchAll(/\d{1,3}(?:[.,]\d{3})+/g)].map(x=>parseInt(x[0].replace(/[.,]/g,"")));tot=Math.max(0,...ns)}
  M.type="out";if(tot)M.amt=tot;M.note=(lines.find(l=>l.trim().length>3)||"Struk").trim().slice(0,40);const g=guess(tx.toLowerCase());M.cat=(g||S.exp[0]).id;
  form();$("#ns").textContent="Struk terbaca (total "+rp(tot)+"). Cek & lengkapi.";}
 catch(e){$("#ns").textContent="Gagal membaca struk, isi manual."}};

// ---------- Tombol back: popup bertingkat + keluar 2x ----------
// riwayat: [base] [guard] [penanda tab/popup ...]. Jumlah penanda = kedalaman layar saat ini.
let HD=0,ign=0,atBase=false,tmB=0,tmS=0;
const tEl=document.createElement("div");tEl.className="toast";document.body.append(tEl);let tmT=0;
const toast=m=>{tEl.textContent=m;tEl.classList.add("on");clearTimeout(tmT);tmT=setTimeout(()=>tEl.classList.remove("on"),2000)};
const LC=()=>document.querySelectorAll(".dl").length+PS.length+($("#md").innerHTML.trim()?1:0);
const want=()=>(tab!="home"?1:0)+LC();
function settle(){if(ign>0)return sched();const w=want();
 if(HD<w){if(atBase){clearTimeout(tmB);atBase=false;history.pushState({g:1},"")}while(HD<w){HD++;history.pushState({m:HD},"")}}
 else if(HD>w){const n=HD-w;HD=w;ign++;history.go(-n);setTimeout(()=>{ign=0},800)}}
function sched(){clearTimeout(tmS);tmS=setTimeout(settle,40)}
const closeTop=()=>{const d=[...document.querySelectorAll(".dl")].pop();if(d){const x=d.querySelector("[data-x]");x?x.click():d.remove();return 1}
 if(PS.length){PS.pop();drawP();return 1}
 if($("#md").innerHTML.trim()){$("#md").innerHTML="";M=null;return 1}return 0};
new MutationObserver(sched).observe(document.body,{childList:true});new MutationObserver(sched).observe($("#md"),{childList:true});
history.replaceState({b:1},"");history.pushState({g:1},"");
addEventListener("popstate",()=>{if(ign>0){ign--;return}
 if(HD>0){HD--;if(!closeTop()&&tab!="home"){tab=tab=="kategori"?"profil":"home";r();scrollTo(0,0)}sched();return}
 atBase=true;toast("Geser kembali sekali lagi untuk keluar");clearTimeout(tmB);tmB=setTimeout(()=>{if(atBase){atBase=false;history.pushState({g:1},"")}},2200)});
applyTheme();r();initFB().catch(e=>console.error(e));
