<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;height:100vh;font-family:system-ui,sans-serif;background:#111;color:#fff}
section{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;visibility:hidden;overflow:auto}
section.on{visibility:visible}
button{font-size:20px;padding:14px 28px;border:0;border-radius:14px;background:#fff;color:#111}
button.s{background:#333;color:#fff}button:disabled{opacity:.4}
input,textarea{font-size:16px;padding:8px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;width:100%;max-width:420px}
#timer{position:fixed;top:12px;right:16px;font-size:24px;z-index:9}
#gear{position:absolute;right:16px;bottom:16px;font-size:16px;padding:10px 14px}
#v{width:100%;max-height:58vh;object-fit:contain;background:#000;border-radius:12px}
#cd{position:absolute;font-size:120px;font-weight:700;text-shadow:0 0 20px #000}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{position:relative;width:90px;height:90px;border:2px dashed #555;border-radius:8px;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover}
.slot b{position:absolute;top:2px;right:4px;background:#000a;padding:0 6px;border-radius:6px}
#tpls img{height:50vh;max-width:45vw;object-fit:contain;border:2px solid #444;border-radius:10px;background:#222}
#result,#dlimg{max-height:60vh;max-width:90vw}
label{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;max-width:420px}
label input{width:140px}
</style>
</head>
<body>
<div id="timer"></div>

<section id="home" class="on">
  <h1>Photobooth</h1>
  <button id="start">Mulai</button>
  <button id="gear" class="s">Pengaturan</button>
</section>

<section id="pay">
  <h2>Scan QRIS untuk membayar</h2>
  <img id="qr" width="280" height="280" alt="QRIS" style="background:#fff;border-radius:12px">
  <div id="amt"></div>
  <button class="s" data-home>Batal</button>
</section>

<section id="pick">
  <h2>Pilih template</h2>
  <div id="tpls" class="row"></div>
</section>

<section id="shoot">
  <div style="position:relative;width:100%;display:flex;justify-content:center">
    <video id="v" autoplay muted playsinline></video><div id="cd"></div>
  </div>
  <div id="thumbs" class="row"></div>
  <div class="row"><button id="snap">Ambil foto</button><button id="next" disabled>Lanjut</button></div>
</section>

<section id="review">
  <h2>Hasil foto</h2>
  <img id="result" alt="Hasil">
  <div>Scan untuk mengunduh</div>
  <div id="qrbox" style="background:#fff;padding:8px;border-radius:8px"></div>
  <button class="s" data-home>Selesai</button>
</section>

<section id="login">
  <h2>Login admin</h2>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Kata sandi">
  <div class="row"><button id="doLogin">Masuk</button><button class="s" data-home>Batal</button></div>
</section>

<section id="admin">
  <h2>Pengaturan</h2>
  <div id="fields"></div>
  <button id="save">Simpan pengaturan</button>
  <h3>Template</h3>
  <div id="tlist"></div>
  <input id="t_name" placeholder="Nama template">
  <input id="t_file" type="file" accept="image/png">
  <div id="t_prev" style="position:relative;width:min(300px,80vw);display:none">
    <img id="t_img" style="width:100%;display:block;background:repeating-conic-gradient(#555 0 25%,#333 0 50%) 0 0/20px 20px" alt="">
  </div>
  <div id="t_hint" style="max-width:420px"></div>
  <button id="addtpl" disabled>Tambah template</button>
  <button class="s" id="out">Keluar admin</button>
</section>

<section id="dl">
  <h2 id="dlmsg">Foto kamu</h2>
  <img id="dlimg" alt="Foto">
  <button id="dlbtn" hidden>Unduh gambar</button>
</section>

<script type="module">
import { app, db, roomRef, candCol, rtcConfig } from "./common.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, addDoc, deleteDoc, updateDoc, query, where }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

const $ = id => document.getElementById(id);
const auth = getAuth(app), storage = getStorage(app), createQris = httpsCallable(getFunctions(app), "createQris");
const S = { cfg: { price: 20000, tPay: 120, tTpl: 60, tPhoto: 180, cd: 3, tReview: 60, bypass: true }, tpls: [], tpl: null, photos: [], tm: null, unsub: null };
const show = id => document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
function timer(sec, end) {
  clearInterval(S.tm); let n = sec;
  const f = () => { $("timer").textContent = n > 0 ? n : ""; if (n-- <= 0) { clearInterval(S.tm); end(); } };
  f(); S.tm = setInterval(f, 1000);
}
function home() { clearInterval(S.tm); S.unsub?.(); $("timer").textContent = ""; S.photos = []; show("home"); }
document.querySelectorAll("[data-home]").forEach(b => b.onclick = home);

// ---------- pengaturan & template (publik, dibaca semua) ----------
onSnapshot(doc(db, "settings", "main"), s => { S.cfg = { ...S.cfg, ...(s.data() || {}) }; });
onSnapshot(collection(db, "templates"), snap => {
  S.tpls = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  if ($("admin").classList.contains("on")) listTpls();
});

// ---------- 1. pembayaran QRIS dinamis ----------
$("start").onclick = pay;
async function pay() {
  if (S.cfg.bypass) return pick();
  show("pay"); timer(S.cfg.tPay, home);
  $("qr").removeAttribute("src");
  $("amt").textContent = "Rp " + Number(S.cfg.price).toLocaleString("id-ID");
  try {
    const { orderId, qrUrl } = (await createQris()).data;
    $("qr").src = qrUrl;
    S.unsub = onSnapshot(doc(db, "orders", orderId), s => { if (s.data()?.status === "paid") { S.unsub(); pick(); } });
  } catch (e) { $("amt").textContent = "Gagal membuat QRIS: " + e.message; }
}

// ---------- 2. pilih template ----------
function pick() {
  show("pick"); timer(S.cfg.tTpl, home); $("tpls").innerHTML = "";
  S.tpls.forEach(t => { const i = new Image(); i.src = t.url; i.alt = t.name; i.onclick = () => shoot(t); $("tpls").append(i); });
}

// ---------- 3. sesi foto ----------
function shoot(t) {
  S.tpl = t; S.photos = new Array(t.slots.length).fill(null);
  show("shoot"); drawSlots();
  timer(S.cfg.tPhoto, () => S.photos.every(Boolean) ? compose() : home());
}
function drawSlots() {
  const el = $("thumbs"); el.innerHTML = "";
  S.photos.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "slot";
    if (p) { const im = new Image(); im.src = p.url; const x = document.createElement("b"); x.textContent = "✕";
      x.onclick = () => { S.photos[i] = null; drawSlots(); }; d.append(im, x); }
    el.append(d);
  });
  const full = S.photos.every(Boolean); $("snap").disabled = full; $("next").disabled = !full;
}
$("snap").onclick = async () => {
  const i = S.photos.indexOf(null); if (i < 0) return;
  $("snap").disabled = true;
  for (let n = S.cfg.cd; n > 0; n--) { $("cd").textContent = n; await new Promise(r => setTimeout(r, 1000)); }
  $("cd").textContent = "";
  const v = $("v"), c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  S.photos[i] = { cv: c, url: c.toDataURL("image/jpeg", .6) }; drawSlots();
};
$("next").onclick = compose;

// ---------- 4. gabung otomatis + 5. review & unggah ----------
const load = u => new Promise((r, j) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => r(i); i.onerror = j; i.src = u; });
async function compose() {
  show("review"); timer(S.cfg.tReview, home); $("qrbox").innerHTML = "";
  const t = S.tpl, c = document.createElement("canvas"); c.width = t.w; c.height = t.h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, t.w, t.h);
  t.slots.forEach((s, i) => {
    const p = S.photos[i].cv, k = Math.max(s.w / p.width, s.h / p.height), w = p.width * k, h = p.height * k;
    x.save(); x.beginPath(); x.rect(s.x, s.y, s.w, s.h); x.clip();
    x.drawImage(p, s.x + (s.w - w) / 2, s.y + (s.h - h) / 2, w, h); x.restore();
  });
  x.drawImage(await load(t.url), 0, 0, t.w, t.h); // bingkai di atas foto
  $("result").src = c.toDataURL("image/jpeg", .85);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .9));
  const id = crypto.randomUUID().slice(0, 12), rf = sref(storage, "results/" + id + ".jpg");
  await uploadBytes(rf, blob, { contentType: "image/jpeg" });
  await setDoc(doc(db, "results", id), { url: await getDownloadURL(rf), created: Date.now() });
  new QRCode($("qrbox"), { text: location.origin + "/?d=" + id, width: 220, height: 220 });
}

// ---------- 6. halaman unduh (dibuka dari QR di HP customer) ----------
const dId = new URLSearchParams(location.search).get("d");
if (dId) {
  show("dl"); $("timer").hidden = true;
  getDoc(doc(db, "results", dId)).then(s => {
    if (!s.exists()) { $("dlmsg").textContent = "Foto tidak ditemukan atau sudah kedaluwarsa."; return; }
    const url = s.data().url; $("dlimg").src = url;
    $("dlimg").onerror = () => { $("dlimg").hidden = true; $("dlmsg").textContent = "Foto sudah kedaluwarsa (disimpan maks. 7 hari)."; };
    $("dlbtn").hidden = false;
    $("dlbtn").onclick = async () => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(await (await fetch(url)).blob());
      a.download = "photobooth.jpg"; a.click();
    };
  });
} else bootCamera();

// ---------- kamera iPhone via WebRTC (dari prototipe) ----------
let pc = null, unsubCand = null, handled = null;
function bootCamera() {
  setDoc(roomRef, { want: Date.now() }, { merge: true });
  onSnapshot(roomRef, snap => { const d = snap.data(); if (d?.offer && d.session && d.session !== handled) answer(d); });
}
async function answer(d) {
  const session = handled = d.session; unsubCand?.(); pc?.close();
  const peer = pc = new RTCPeerConnection(rtcConfig);
  peer.ontrack = e => { $("v").srcObject = e.streams[0]; $("v").play().catch(() => {}); };
  peer.onicecandidate = e => { if (e.candidate) addDoc(candCol, { from: "booth", session, candidate: e.candidate.toJSON() }); };
  await peer.setRemoteDescription(d.offer); if (pc !== peer) return;
  unsubCand = onSnapshot(query(candCol, where("session", "==", session)), snap => snap.docChanges().forEach(ch => {
    const c = ch.doc.data(); if (ch.type === "added" && c.from === "camera") peer.addIceCandidate(c.candidate).catch(() => {});
  }));
  const a = await peer.createAnswer(); await peer.setLocalDescription(a); if (pc !== peer) return;
  await updateDoc(roomRef, { answer: { type: a.type, sdp: a.sdp }, answerSession: session });
}

// ---------- admin ----------
$("gear").onclick = () => auth.currentUser ? adminOpen() : show("login");
$("doLogin").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("em").value, $("pw").value); adminOpen(); }
  catch (e) { alert("Login gagal: " + e.message); }
};
const L = { price: "Harga (Rp)", tPay: "Waktu bayar (dtk)", tTpl: "Waktu pilih template (dtk)", tPhoto: "Waktu sesi foto (dtk)", cd: "Hitung mundur foto (dtk)", tReview: "Waktu review (dtk)" };
$("fields").innerHTML = Object.entries(L).map(([k, t]) => `<label>${t}<input id="f_${k}" type="number"></label>`).join("")
  + `<label>Lewati pembayaran (mode uji)<input id="f_bypass" type="checkbox"></label>`;
function adminOpen() {
  show("admin"); clearInterval(S.tm); $("timer").textContent = "";
  Object.keys(L).forEach(k => $("f_" + k).value = S.cfg[k]); $("f_bypass").checked = !!S.cfg.bypass; listTpls();
}
$("save").onclick = async () => {
  const c = { bypass: $("f_bypass").checked }; Object.keys(L).forEach(k => c[k] = +$("f_" + k).value);
  try { await setDoc(doc(db, "settings", "main"), c, { merge: true }); alert("Tersimpan"); } catch (e) { alert(e.message); }
};
function listTpls() {
  $("tlist").innerHTML = "";
  S.tpls.forEach(t => {
    const r = document.createElement("div"); r.className = "row";
    r.append(Object.assign(document.createElement("span"), { textContent: `${t.name} (${t.w}x${t.h}, ${t.slots.length} foto)` }));
    const b = Object.assign(document.createElement("button"), { textContent: "Hapus", className: "s" });
    b.onclick = () => confirm("Hapus " + t.name + "?") && deleteDoc(doc(db, "templates", t.id)); r.append(b); $("tlist").append(r);
  });
}
let det = null;
$("t_file").onchange = async () => {
  const f = $("t_file").files[0]; det = null; $("addtpl").disabled = true;
  if (!f) { $("t_prev").style.display = "none"; return; }
  $("t_hint").textContent = "Mendeteksi area foto…";
  const im = await createImageBitmap(f), W = im.width, H = im.height;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const cx = c.getContext("2d", { willReadFrequently: true }); cx.drawImage(im, 0, 0);
  const d = cx.getImageData(0, 0, W, H).data;
  const k = Math.max(1, Math.ceil(W / 1000)), w = Math.floor(W / k), h = Math.floor(H / k);
  const g = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) g[y * w + x] = d[((y * k) * W + x * k) * 4 + 3] <= 10 ? 1 : 0;
  const boxes = [], st = [], m = k + 4;
  for (let s0 = 0; s0 < w * h; s0++) {
    if (g[s0] !== 1) continue;
    let x0 = w, y0 = h, x1 = 0, y1 = 0, cnt = 0; g[s0] = 2; st.push(s0);
    while (st.length) {
      const p = st.pop(), x = p % w, y = (p / w) | 0; cnt++;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      if (x > 0 && g[p - 1] === 1) { g[p - 1] = 2; st.push(p - 1); }
      if (x < w - 1 && g[p + 1] === 1) { g[p + 1] = 2; st.push(p + 1); }
      if (y > 0 && g[p - w] === 1) { g[p - w] = 2; st.push(p - w); }
      if (y < h - 1 && g[p + w] === 1) { g[p + w] = 2; st.push(p + w); }
    }
    if (cnt > w * h * 0.005) {
      const x = Math.max(0, x0 * k - m), y = Math.max(0, y0 * k - m);
      boxes.push({ x, y, w: Math.min(W, (x1 + 1) * k + m) - x, h: Math.min(H, (y1 + 1) * k + m) - y });
    }
  }
  boxes.sort((a, b) => a.y - b.y || a.x - b.x);
  if (!boxes.length) { $("t_prev").style.display = "none"; $("t_hint").textContent = "Tidak ada area transparan. Pastikan PNG punya lubang transparan di tempat foto."; return; }
  det = { boxes, w: W, h: H, order: boxes.map((_, i) => i) };
  $("t_img").src = URL.createObjectURL(f); $("t_prev").style.display = "block"; drawDet();
};
function drawDet() {
  const p = $("t_prev"); p.querySelectorAll(".bx").forEach(e => e.remove());
  det.boxes.forEach((b, i) => {
    const e = document.createElement("div"), n = det.order.indexOf(i); e.className = "bx";
    e.style.cssText = `position:absolute;left:${b.x / det.w * 100}%;top:${b.y / det.h * 100}%;width:${b.w / det.w * 100}%;height:${b.h / det.h * 100}%;border:3px solid #0f0;background:#0f03;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;cursor:pointer`;
    e.textContent = n >= 0 ? n + 1 : "";
    e.onclick = () => { det.order = det.order.length === det.boxes.length ? [i] : det.order.includes(i) ? det.order : [...det.order, i]; drawDet(); };
    p.append(e);
  });
  const ok = det.order.length === det.boxes.length; $("addtpl").disabled = !ok;
  $("t_hint").textContent = `${det.boxes.length} area foto terdeteksi. Angka = urutan foto. ` + (ok ? "Klik kotak untuk mengubah urutan." : "Lanjut klik kotak sesuai urutan.");
}
$("addtpl").onclick = async () => {
  try {
    const f = $("t_file").files[0]; if (!f || !det) return;
    const rf = sref(storage, "templates/" + Date.now() + ".png"); await uploadBytes(rf, f);
    await addDoc(collection(db, "templates"), { name: $("t_name").value || "Template", url: await getDownloadURL(rf), w: det.w, h: det.h, slots: det.order.map(i => det.boxes[i]) });
    alert("Template ditambahkan"); $("t_file").value = ""; $("t_name").value = ""; $("t_prev").style.display = "none"; $("t_hint").textContent = ""; det = null; $("addtpl").disabled = true;
  } catch (e) { alert(e.message); }
};
$("out").onclick = async () => { await signOut(auth); home(); };
</script>
</body>
</html>
