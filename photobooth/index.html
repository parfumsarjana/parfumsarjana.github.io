<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#1b1e26;--line:#323746;--ac:#ffd24a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;height:100dvh;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff}
h1,h2,h3{margin:0}
section{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px;text-align:center;visibility:hidden;overflow:auto}
section>:first-child{margin-top:auto}section>:last-child{margin-bottom:auto}
section.on{visibility:visible}
button{font:600 20px system-ui,sans-serif;padding:14px 28px;border:0;border-radius:14px;background:var(--ac);color:#111;cursor:pointer;touch-action:manipulation}
button.s{background:#2b3040;color:#fff}button:disabled{opacity:.35}button:active{transform:scale(.97)}
a.btn{display:inline-block;text-decoration:none;font:600 18px system-ui,sans-serif;padding:12px 22px;border-radius:12px;background:var(--ac);color:#111}
a.btn.s{background:#2b3040;color:#fff}
input,textarea{font-size:16px;padding:8px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;width:100%;max-width:420px}
#timer{position:fixed;top:12px;right:16px;font-size:26px;font-weight:700;z-index:9;background:#0008;border-radius:10px;padding:0 10px}
#timer:empty{display:none}
#gear{position:absolute;right:16px;bottom:16px;font-size:16px;padding:10px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:12px}
.hint{opacity:.8;font-size:16px;max-width:520px}

/* sesi foto: preview 4:3 besar */
.vwrap{position:relative;width:min(100%,calc((100vh - 235px) * 4 / 3));width:min(100%,calc((100dvh - 235px) * 4 / 3));aspect-ratio:4/3;background:#000;border-radius:16px;overflow:hidden;flex:none}
#v{width:100%;height:100%;object-fit:cover;display:block;background:#000}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,22vh,200px);font-weight:700;text-shadow:0 0 24px #000;pointer-events:none}
#thumbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{position:relative;width:96px;height:72px;border:2px dashed #555;border-radius:8px;overflow:hidden;cursor:pointer;flex:none}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot b{position:absolute;top:2px;right:3px;background:#000b;min-width:24px;height:24px;border-radius:12px;font-size:14px;line-height:24px}
.slot i{position:absolute;left:4px;bottom:2px;font-style:normal;font-weight:700;font-size:18px;text-shadow:0 0 4px #000}
.slot:not(:has(img)){cursor:default}.slot:not(:has(img)) i{left:0;right:0;bottom:auto;top:50%;transform:translateY(-50%);font-size:28px;opacity:.35;text-shadow:none}

#tpls{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#tpls img{height:min(60vh,520px);max-width:44vw;object-fit:contain;border:2px solid #444;border-radius:10px;background:#222;cursor:pointer}

/* review & selesai */
.rv{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%;max-width:1100px;align-items:center;justify-items:center}
.rv>div{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
@media (max-width:760px),(max-aspect-ratio:1/1){.rv{grid-template-columns:1fr}#pv,#final{max-height:46vh!important}}
#pv,#final{max-width:100%;max-height:72vh;width:auto;height:auto;border-radius:10px;background:#222;box-shadow:0 6px 30px #0008}
#pv{cursor:pointer;touch-action:manipulation}
#tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;width:100%;max-height:40vh;overflow:auto;padding:2px}
.tp{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:3px solid transparent;cursor:pointer;background:#000}
.tp img{width:100%;height:100%;object-fit:cover;display:block}
.tp.pl{border-color:var(--ac)}.tp.pl img{opacity:.5}
.tp i{position:absolute;left:4px;top:4px;min-width:28px;height:28px;border-radius:14px;background:var(--ac);color:#111;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}
.tp button{position:absolute;right:4px;bottom:4px;font-size:16px;padding:4px 9px;border-radius:8px;background:#000b;color:#fff}

#lb{position:fixed;inset:0;z-index:30;background:#000e;display:none;align-items:center;justify-content:center;padding:12px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#busy{position:fixed;inset:0;z-index:40;background:#000d;display:none;align-items:center;justify-content:center;font-size:26px}
#busy.on{display:flex}

/* halaman unduh */
#dlimg{max-height:60vh;max-width:100%;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.grid div{display:flex;flex-direction:column;gap:8px;align-items:center}
.grid img{width:100%;border-radius:8px;aspect-ratio:4/3;object-fit:cover}
#dlvid2{max-width:100%;border-radius:10px;background:#000}

label{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;max-width:420px}
label input{width:140px}

#prt{display:none}
@media print{
  @page{margin:0}
  html,body{background:#fff!important;height:auto}
  body>*{display:none!important}
  body>#prt{display:flex!important;align-items:center;justify-content:center;width:100vw;height:100vh}
  #prt img{max-width:100%;max-height:100vh;object-fit:contain}
}
</style>
</head>
<body>
<div id="timer"></div>
<div id="prt"><img id="prtimg" alt=""></div>
<div id="lb"><img id="lbimg" alt=""></div>
<div id="busy">Menyimpan hasil…</div>

<section id="home" class="on">
  <h1 style="font-size:56px">Photobooth</h1>
  <button id="start" style="font-size:28px;padding:20px 60px">Mulai</button>
  <button id="gear" class="s">Pengaturan</button>
  <div id="who" style="position:absolute;left:16px;bottom:22px;font-size:14px;opacity:.6"></div>
</section>

<section id="pay">
  <h2>Scan QRIS untuk membayar</h2>
  <img id="qr" width="280" height="280" alt="QRIS" style="background:#fff;border-radius:12px">
  <div id="amt" style="font-size:24px"></div>
  <div class="row"><button class="s" data-home>Batal</button><button id="opconf" class="s" style="font-size:14px">Konfirmasi (operator)</button></div>
</section>

<section id="pick">
  <h2>Pilih template</h2>
  <div id="tpls"></div>
</section>

<section id="shoot">
  <div class="vwrap"><video id="v" autoplay muted playsinline></video><div id="cd"></div></div>
  <div id="thumbs"></div>
  <div id="cnt" class="hint"></div>
  <div class="row"><button id="snap">Ambil foto</button><button id="next" disabled>Lanjut</button></div>
</section>

<section id="review">
  <h2>Hasil foto</h2>
  <div class="rv">
    <div><canvas id="pv"></canvas></div>
    <div>
      <div class="hint" id="rvhint"></div>
      <div id="tray"></div>
      <div class="row">
        <button class="s" id="reorder">Urutkan ulang</button>
        <button class="s" id="again">Foto lagi</button>
        <button id="save" disabled>Simpan &amp; lanjut</button>
      </div>
    </div>
  </div>
</section>

<section id="done">
  <h2>Foto kamu siap!</h2>
  <div class="rv">
    <div><img id="final" alt="Hasil"></div>
    <div>
      <div>Scan untuk mengunduh foto, foto asli, dan video timelapse</div>
      <div id="qrbox" style="background:#fff;padding:10px;border-radius:12px"></div>
      <div class="row"><button id="print">Cetak</button><button class="s" data-home>Selesai</button></div>
    </div>
  </div>
</section>

<section id="login">
  <h2>Login akun</h2>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Kata sandi">
  <div class="row"><button id="doLogin">Masuk</button><button class="s" data-home>Batal</button></div>
</section>

<section id="admin">
  <h2>Pengaturan</h2>
  <div id="fields"></div>
  <button id="save2">Simpan pengaturan</button>
  <h3>Template</h3>
  <div id="tlist"></div>
  <input id="t_name" placeholder="Nama template">
  <input id="t_file" type="file" accept="image/png">
  <div id="t_prev" style="position:relative;width:min(300px,80vw);display:none">
    <img id="t_img" style="width:100%;display:block;background:repeating-conic-gradient(#555 0 25%,#333 0 50%) 0 0/20px 20px" alt="">
  </div>
  <div id="t_hint" style="max-width:420px"></div>
  <button id="addtpl" disabled>Tambah template</button>
  <div class="row"><button class="s" id="close">Tutup</button><button class="s" id="out">Keluar akun</button></div>
</section>

<section id="dl">
  <h2 id="dlmsg">Foto kamu</h2>
  <div class="card">
    <img id="dlimg" alt="Foto">
    <a id="dlmain" class="btn" download="photobooth-template.jpg" hidden>Unduh foto template</a>
  </div>
  <div class="card" id="orgc" hidden>
    <h3>Foto asli</h3>
    <div id="orgs" class="grid"></div>
  </div>
  <div class="card" id="vidc" hidden>
    <h3>Video timelapse</h3>
    <video id="dlvid2" controls playsinline hidden></video>
    <button id="mkvid">Buat video timelapse</button>
    <a id="dlvid" class="btn" hidden>Unduh video</a>
    <div id="vidst" class="hint"></div>
  </div>
</section>

<script type="module">
import { app, db, roomRef, candCol, rtcConfig } from "./common.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, addDoc, deleteDoc, updateDoc, query, where, getDocs }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

const $ = id => document.getElementById(id);
const auth = getAuth(app), createQris = httpsCallable(getFunctions(app), "createQris");
const S = { cfg: { price: 20000, tPay: 120, tTpl: 60, tPhoto: 180, cd: 3, tReview: 90, tDone: 90, bypass: true, payMode: "manual", pin: "", qrisImg: "" },
  tpls: [], tpl: null, tplP: null, photos: [], place: [], frames: [], tm: null, fiv: null, unsub: null };
const show = id => document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
function timer(sec, end) {
  clearInterval(S.tm); let n = sec;
  const f = () => { $("timer").textContent = n > 0 ? n : ""; if (n-- <= 0) { clearInterval(S.tm); end(); } };
  f(); S.tm = setInterval(f, 1000);
}
function home() {
  clearInterval(S.tm); clearInterval(S.fiv); S.unsub?.(); $("timer").textContent = "";
  S.photos = []; S.place = []; S.frames = []; $("busy").classList.remove("on"); show("home");
}
document.querySelectorAll("[data-home]").forEach(b => b.onclick = home);
const zoom = src => { $("lbimg").src = src; $("lb").classList.add("on"); };
$("lb").onclick = () => $("lb").classList.remove("on");

// ---------- data per akun: pengaturan & template milik pemilik yang login ----------
const DEF = { ...S.cfg };
let unsubData = [], unsubRoom = null;
onAuthStateChanged(auth, u => {
  unsubData.forEach(f => f()); unsubData = []; unsubRoom?.(); unsubRoom = null; pc?.close(); handled = null;
  S.uid = u ? u.uid : null; S.cfg = { ...DEF }; S.tpls = []; $("who").textContent = u ? u.email : "";
  if (!u) return;
  unsubData.push(onSnapshot(doc(db, "owners", u.uid), s => { S.cfg = { ...DEF, ...(s.data() || {}) }; }));
  unsubData.push(onSnapshot(collection(db, "owners", u.uid, "templates"), snap => {
    S.tpls = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if ($("admin").classList.contains("on")) listTpls();
  }));
  if (!dId) bootCamera();
});

// ---------- 1. pembayaran QRIS dinamis ----------
$("start").onclick = () => auth.currentUser ? pay() : show("login");
async function pay() {
  if (S.cfg.bypass) return pick();
  show("pay"); timer(S.cfg.tPay, home);
  $("amt").textContent = "Rp " + Number(S.cfg.price).toLocaleString("id-ID");
  const auto = S.cfg.payMode === "auto"; $("opconf").hidden = auto;
  if (!auto) { $("qr").src = S.cfg.qrisImg || ""; return; }
  $("qr").removeAttribute("src");
  try {
    const { orderId, qrUrl } = (await createQris()).data;
    $("qr").src = qrUrl;
    S.unsub = onSnapshot(doc(db, "orders", orderId), s => { if (s.data()?.status === "paid") { S.unsub(); pick(); } });
  } catch (e) { $("amt").textContent = "Gagal membuat QRIS: " + e.message; }
}
$("opconf").onclick = () => { const p = prompt("PIN operator:"); if (p === null) return; p === String(S.cfg.pin || "") ? pick() : alert("PIN salah"); };

// ---------- 2. pilih template ----------
function pick() {
  show("pick"); timer(S.cfg.tTpl, home); $("tpls").innerHTML = "";
  S.tpls.forEach(t => { const i = new Image(); i.src = t.url; i.alt = t.name; i.onclick = () => shoot(t); $("tpls").append(i); });
}

// ---------- 3. sesi foto (preview & hasil 4:3) ----------
const load = u => new Promise((r, j) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => r(i); i.onerror = j; i.src = u; });
const maxPool = () => Math.min(12, S.tpl.slots.length * 2);
function crop43(v) {
  const vw = v.videoWidth, vh = v.videoHeight; let sw = vw, sh = vh;
  if (vw / vh > 4 / 3) sw = vh * 4 / 3; else sh = vw * 3 / 4;
  return [(vw - sw) / 2, (vh - sh) / 2, sw, sh];
}
const fc = document.createElement("canvas"); fc.width = 240; fc.height = 180;
function grabFrame() {
  const v = $("v"); if (!v.videoWidth || S.frames.length >= 300) return;
  const [sx, sy, sw, sh] = crop43(v);
  fc.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, 240, 180);
  S.frames.push(fc.toDataURL("image/jpeg", .5).slice(23)); // buang "data:image/jpeg;base64,"
}
function shoot(t) {
  S.tpl = t; S.photos = []; S.place = []; S.frames = [];
  S.tplP = load(t.url); S.tplP.catch(() => {});
  show("shoot"); drawSlots();
  clearInterval(S.fiv); S.fiv = setInterval(grabFrame, 1000);
  timer(S.cfg.tPhoto, () => S.photos.length >= t.slots.length ? review() : home());
}
function drawSlots() {
  const el = $("thumbs"); el.innerHTML = "";
  const n = Math.max(S.photos.length, S.tpl.slots.length);
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div"), p = S.photos[i]; d.className = "slot";
    if (p) {
      const im = new Image(); im.src = p.url; d.onclick = () => zoom(p.cv.toDataURL("image/jpeg", .9));
      const x = document.createElement("b"); x.textContent = "✕";
      x.onclick = e => { e.stopPropagation(); S.photos.splice(i, 1); drawSlots(); };
      d.append(im, x);
    }
    const num = document.createElement("i"); num.textContent = i + 1; d.append(num);
    el.append(d);
  }
  const need = S.tpl.slots.length;
  $("cnt").textContent = `Foto ${S.photos.length} dari ${need}` + (maxPool() > need ? ` · boleh ambil sampai ${maxPool()} foto, pilih yang terbaik nanti` : "") + ". Klik foto untuk memperbesar.";
  $("snap").disabled = S.photos.length >= maxPool(); $("next").disabled = S.photos.length < need;
}
$("snap").onclick = async () => {
  if (!$("v").videoWidth) return alert("Kamera belum tersambung.");
  $("snap").disabled = true;
  for (let n = S.cfg.cd; n > 0; n--) { $("cd").textContent = n; await new Promise(r => setTimeout(r, 1000)); }
  $("cd").textContent = "";
  if (!$("shoot").classList.contains("on")) return;
  const v = $("v"), [sx, sy, sw, sh] = crop43(v), k = Math.min(1, 1600 / sw);
  const c = document.createElement("canvas"); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  c.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const th = document.createElement("canvas"); th.width = 240; th.height = 180; th.getContext("2d").drawImage(c, 0, 0, 240, 180);
  S.photos.push({ cv: c, url: th.toDataURL("image/jpeg", .7) }); drawSlots();
};
$("next").onclick = review;
$("again").onclick = () => {
  show("shoot"); drawSlots(); clearInterval(S.fiv); S.fiv = setInterval(grabFrame, 1000);
  timer(S.cfg.tPhoto, () => S.photos.length >= S.tpl.slots.length ? review() : home());
};

// ---------- 4. review: hapus & urutkan foto di template ----------
function review() {
  clearInterval(S.fiv);
  S.place = S.tpl.slots.map((_, i) => i < S.photos.length ? i : null);
  show("review"); $("again").hidden = S.photos.length >= maxPool();
  timer(S.cfg.tReview, () => autoFill() ? save() : home());
  refresh();
}
function autoFill() {
  for (let i = 0; i < S.place.length; i++) if (S.place[i] == null) {
    const free = S.photos.findIndex((_, j) => !S.place.includes(j)); if (free < 0) return false; S.place[i] = free;
  }
  return true;
}
async function renderTpl(c, preview) {
  const t = S.tpl, img = await S.tplP;
  c.width = t.w; c.height = t.h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, t.w, t.h);
  t.slots.forEach((s, i) => {
    const pi = S.place[i];
    if (pi != null) {
      const p = S.photos[pi].cv, k = Math.max(s.w / p.width, s.h / p.height), w = p.width * k, h = p.height * k;
      x.save(); x.beginPath(); x.rect(s.x, s.y, s.w, s.h); x.clip();
      x.drawImage(p, s.x + (s.w - w) / 2, s.y + (s.h - h) / 2, w, h); x.restore();
    } else if (preview) { x.fillStyle = "#2b3040"; x.fillRect(s.x, s.y, s.w, s.h); }
  });
  x.drawImage(img, 0, 0, t.w, t.h); // bingkai di atas foto
  if (preview) {
    x.textAlign = "center"; x.textBaseline = "middle";
    t.slots.forEach((s, i) => {
      const m = Math.min(s.w, s.h);
      if (S.place[i] != null) {
        const r = m * .07, cx = s.x + r * 1.6, cy = s.y + r * 1.6;
        x.fillStyle = "#ffd24a"; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
        x.fillStyle = "#111"; x.font = `700 ${r * 1.3}px system-ui`; x.fillText(i + 1, cx, cy + r * .06);
      } else {
        x.fillStyle = "#ffffffcc"; x.font = `700 ${m * .4}px system-ui`; x.fillText(i + 1, s.x + s.w / 2, s.y + s.h / 2);
      }
    });
  }
  return c;
}
function drawTray() {
  const el = $("tray"); el.innerHTML = "";
  S.photos.forEach((p, idx) => {
    const d = document.createElement("div"), no = S.place.indexOf(idx); d.className = "tp" + (no >= 0 ? " pl" : "");
    const im = new Image(); im.src = p.url; d.append(im);
    if (no >= 0) { const b = document.createElement("i"); b.textContent = no + 1; d.append(b); }
    const z = document.createElement("button"); z.className = "s"; z.textContent = "🔍";
    z.onclick = e => { e.stopPropagation(); zoom(p.cv.toDataURL("image/jpeg", .9)); };
    d.append(z); d.onclick = () => toggle(idx); el.append(d);
  });
}
function toggle(idx) {
  const s = S.place.indexOf(idx);
  if (s >= 0) S.place[s] = null; else { const e = S.place.indexOf(null); if (e < 0) return; S.place[e] = idx; }
  refresh();
}
function refresh() {
  drawTray(); renderTpl($("pv"), true);
  const full = !S.place.includes(null); $("save").disabled = !full;
  $("rvhint").textContent = full
    ? "Semua slot terisi. Klik slot atau foto untuk melepasnya, atau “Urutkan ulang” untuk menyusun dari awal."
    : "Klik foto di bawah secara berurutan untuk mengisi slot 1, 2, 3, dan seterusnya.";
}
$("reorder").onclick = () => { S.place = S.tpl.slots.map(() => null); refresh(); };
$("pv").onclick = e => {
  const r = $("pv").getBoundingClientRect(), t = S.tpl, px = (e.clientX - r.left) * t.w / r.width, py = (e.clientY - r.top) * t.h / r.height;
  const i = t.slots.findIndex(s => px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h);
  if (i >= 0 && S.place[i] != null) { S.place[i] = null; refresh(); }
};

// ---------- 5. simpan (template + foto asli + timelapse) ----------
function fit(c, max) { let q = .85, u; do { u = c.toDataURL("image/jpeg", q); q -= .07; } while (u.length > max && q > .3); return u; }
$("save").onclick = save;
async function save() {
  clearInterval(S.tm); $("timer").textContent = ""; $("busy").classList.add("on");
  try {
    const id = crypto.randomUUID().slice(0, 12), owner = S.uid, created = Date.now();
    const url = fit(await renderTpl(document.createElement("canvas"), false), 900000);
    const origs = S.place.map(i => fit(S.photos[i].cv, 900000));
    const chunks = []; let cur = [], size = 0;
    S.frames.forEach(f => { if (size + f.length > 800000) { chunks.push(cur); cur = []; size = 0; } cur.push(f); size += f.length; });
    if (cur.length) chunks.push(cur);
    const part = (n, data) => setDoc(doc(db, "results", id, "parts", n), { ...data, owner, created });
    await Promise.all([...origs.map((u, k) => part("o" + k, { img: u, k })), ...chunks.map((fr, k) => part("t" + k, { frames: fr, k }))]);
    await setDoc(doc(db, "results", id), { img: url, created, owner, n: origs.length, t: chunks.length });
    $("busy").classList.remove("on"); finish(url, id);
  } catch (e) { $("busy").classList.remove("on"); alert("Gagal menyimpan hasil: " + e.message); timer(S.cfg.tReview, home); }
}

async function buildVideo(frames, onp) {
  const imgs = await Promise.all(frames.map(f => load("data:image/jpeg;base64," + f)));
  const c = document.createElement("canvas"); c.width = 320; c.height = 240; const x = c.getContext("2d");
  const mime = ["video/mp4", "video/webm;codecs=vp9", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(c.captureStream(15), mime ? { mimeType: mime, videoBitsPerSecond: 2e6 } : {});
  const parts = []; rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  x.drawImage(imgs[0], 0, 0, 320, 240); rec.start();
  for (let i = 0; i < imgs.length; i++) { x.drawImage(imgs[i], 0, 0, 320, 240); onp(i / imgs.length); await new Promise(r => setTimeout(r, 100)); }
  rec.stop(); await stopped;
  const type = rec.mimeType || mime || "video/webm";
  return { blob: new Blob(parts, { type }), ext: type.includes("mp4") ? "mp4" : "webm" };
}

// ---------- kamera iPhone via WebRTC (dari prototipe) ----------
let pc = null, unsubCand = null, handled = null;
async function cleanup() {
  try {
    const old = await getDocs(query(collection(db, "results"), where("created", "<", Date.now() - 6048e5)));
    for (const d of old.docs) {
      try { const ps = await getDocs(collection(db, "results", d.id, "parts")); await Promise.all(ps.docs.map(p => deleteDoc(p.ref))); } catch {}
      await deleteDoc(d.ref);
    }
  } catch {}
}
function bootCamera() {
  cleanup();
  setDoc(roomRef(S.uid), { want: Date.now() }, { merge: true });
  unsubRoom = onSnapshot(roomRef(S.uid), snap => { const d = snap.data(); if (d?.offer && d.session && d.session !== handled) answer(d); });
}
async function answer(d) {
  const session = handled = d.session; unsubCand?.(); pc?.close();
  const peer = pc = new RTCPeerConnection(rtcConfig);
  peer.ontrack = e => { $("v").srcObject = e.streams[0]; $("v").play().catch(() => {}); };
  peer.onicecandidate = e => { if (e.candidate) addDoc(candCol(S.uid), { from: "booth", session, candidate: e.candidate.toJSON() }); };
  await peer.setRemoteDescription(d.offer); if (pc !== peer) return;
  unsubCand = onSnapshot(query(candCol(S.uid), where("session", "==", session)), snap => snap.docChanges().forEach(ch => {
    const c = ch.doc.data(); if (ch.type === "added" && c.from === "camera") peer.addIceCandidate(c.candidate).catch(() => {});
  }));
  const a = await peer.createAnswer(); await peer.setLocalDescription(a); if (pc !== peer) return;
  await updateDoc(roomRef(S.uid), { answer: { type: a.type, sdp: a.sdp }, answerSession: session });
}

  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return c.toDataURL("image/png");
}

let det = null;
$("t_file").onchange = async () => {
  const f = $("t_file").files[0]; det = null; $("addtpl").disabled = true;
  if (!f) { $("t_prev").style.display = "none"; return; }
  $("t_hint").textContent = "Mendeteksi area foto…";
  const im = await createImageBitmap(f), W = im.width, H = im.height;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const cx = c.getContext("2d", { willReadFrequently: true }); cx.drawImage(im, 0, 0);
  const d = cx.getImageData(0, 0, W, H).data;
  const k = Math.max(1, Math.ceil(W / 1000)), w = Math.floor(W / k), h = Math.floor(H / k);
  const g = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) g[y * w + x] = d[((y * k) * W + x * k) * 4 + 3] <= 10 ? 1 : 0;
  const boxes = [], st = [], m = k + 4;
  for (let s0 = 0; s0 < w * h; s0++) {
    if (g[s0] !== 1) continue;
    let x0 = w, y0 = h, x1 = 0, y1 = 0, cnt = 0; g[s0] = 2; st.push(s0);
    while (st.length) {
      const p = st.pop(), x = p % w, y = (p / w) | 0; cnt++;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      if (x > 0 && g[p - 1] === 1) { g[p - 1] = 2; st.push(p - 1); }
      if (x < w - 1 && g[p + 1] === 1) { g[p + 1] = 2; st.push(p + 1); }
      if (y > 0 && g[p - w] === 1) { g[p - w] = 2; st.push(p - w); }
      if (y < h - 1 && g[p + w] === 1) { g[p + w] = 2; st.push(p + w); }
    }
    if (cnt > w * h * 0.005) {
      const x = Math.max(0, x0 * k - m), y = Math.max(0, y0 * k - m);
      boxes.push({ x, y, w: Math.min(W, (x1 + 1) * k + m) - x, h: Math.min(H, (y1 + 1) * k + m) - y });
    }
  }
  boxes.sort((a, b) => a.y - b.y || a.x - b.x);
  if (!boxes.length) { $("t_prev").style.display = "none"; $("t_hint").textContent = "Tidak ada area transparan. Pastikan PNG punya lubang transparan di tempat foto."; return; }
  det = { boxes, w: W, h: H, order: boxes.map((_, i) => i) };
  $("t_img").src = URL.createObjectURL(f); $("t_prev").style.display = "block"; drawDet();
};
function drawDet() {
  const p = $("t_prev"); p.querySelectorAll(".bx").forEach(e => e.remove());
  det.boxes.forEach((b, i) => {
    const e = document.createElement("div"), n = det.order.indexOf(i); e.className = "bx";
    e.style.cssText = `position:absolute;left:${b.x / det.w * 100}%;top:${b.y / det.h * 100}%;width:${b.w / det.w * 100}%;height:${b.h / det.h * 100}%;border:3px solid #0f0;background:#0f03;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;cursor:pointer`;
    e.textContent = n >= 0 ? n + 1 : "";
    e.onclick = () => { det.order = det.order.length === det.boxes.length ? [i] : det.order.includes(i) ? det.order : [...det.order, i]; drawDet(); };
    p.append(e);
  });
  const ok = det.order.length === det.boxes.length; $("addtpl").disabled = !ok;
  $("t_hint").textContent = `${det.boxes.length} area foto terdeteksi. Angka = urutan foto. ` + (ok ? "Klik kotak untuk mengubah urutan." : "Lanjut klik kotak sesuai urutan.");
}
$("addtpl").onclick = async () => {
  const btn = $("addtpl"), hint = $("t_hint"), f = $("t_file").files[0];
  if (!f || !det) { hint.textContent = "Pilih file PNG dulu dan tunggu kotak hijau muncul."; return; }
  btn.disabled = true; btn.textContent = "Menyimpan…";
  const limit = (p, ms, msg) => Promise.race([p, new Promise((_, j) => setTimeout(() => j(new Error(msg)), ms))]);
  try {
    if (!auth.currentUser) throw new Error("Belum login. Keluar lalu login admin lagi.");
    const im = await createImageBitmap(f); let k = Math.min(1, 1600 / Math.max(im.width, im.height)), c, url;
    for (;;) {
      c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); url = c.toDataURL("image/png");
      if (url.length < 950000 || k < .3) break; k *= .8;
    }
    if (url.length >= 1000000) throw new Error("Template terlalu besar/rumit. Perkecil atau sederhanakan gambarnya.");
    const slots = det.order.map(i => { const b = det.boxes[i]; return { x: Math.round(b.x * c.width / det.w), y: Math.round(b.y * c.height / det.h), w: Math.round(b.w * c.width / det.w), h: Math.round(b.h * c.height / det.h) }; });
    await limit(addDoc(collection(db, "owners", S.uid, "templates"), { name: $("t_name").value || "Template", url, w: c.width, h: c.height, slots }), 20000,
      "Gagal menyimpan. Cek rules Firestore dan dokumen admins/<UID>.");
    alert("Template ditambahkan"); $("t_file").value = ""; $("t_name").value = ""; $("t_prev").style.display = "none"; hint.textContent = ""; det = null;
  } catch (e) { hint.textContent = "Gagal: " + e.message; alert("Gagal: " + e.message); btn.disabled = false; }
  btn.textContent = "Tambah template"; if (det) btn.disabled = false;
};
