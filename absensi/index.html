async cutoffs(m){const rows=await list('cutoffs');await manage(m,{c:'cutoffs',t:'Cut Off',head:['Nama','Tanggal cut off',''],rows,f:[['name','Nama cut off (mis. Bulanan tgl 25)'],['day','Tanggal cut off (1-31)','number']],cols:r=>[esc(r.name),r.day],def:{day:25}})},
async payroll(m){PM=PM||today().slice(0,7);const [y,mm]=PM.split('-').map(Number);
const [st,att,adj,cos,its,hol,lv,c0]=await Promise.all([list('staff'),list('attendance'),list('adjust'),list('cutoffs'),list('adjItems',where('period','==',PM)),list('holidays'),list('leaves'),getDoc(doc(db,'settings','payroll'))]);
const cfg={fixedDiv:0,offDays:[],prorata:'1',...(c0.exists()?c0.data():{})};
const end=(c,Y,M)=>new Date(Y,M,Math.min(c,new Date(Y,M+1,0).getDate())),td=today(),yd=fmtD(new Date(Date.now()-864e5)),isHol=ds=>hol.some(h=>ds>=h.from&&ds<=(h.to||h.from));
const rows=st.map(p=>{const c=cos.find(x=>x.id==p.cutoffId),co=c?.day||25,S=fmtD(new Date(end(co,y,mm-2).getTime()+864e5)),E=fmtD(end(co,y,mm-1)),t=p.payType||'hour',rt=p.rate||0;
const nd=Math.round((new Date(E+'T00:00')-new Date(S+'T00:00'))/864e5)+1,div=+cfg.fixedDiv||nd;
const a=att.filter(x=>x.email==p.email&&x.date>=S&&x.date<=E&&x.outAt),h=a.reduce((n,x)=>n+hrs(x),0),d=new Set(a.map(x=>x.date)).size;
const base=t=='shift'?a.length*rt/div:t=='month'?rt:(t=='day'?d:h)*rt;
let abs=0,cut=0;
if(t=='month'){const lim=E<td?E:yd,pres=new Set(att.filter(x=>x.email==p.email&&x.inAt).map(x=>x.date));
for(let dd=new Date(S+'T00:00');fmtD(dd)<=lim;dd.setDate(dd.getDate()+1)){const ds=fmtD(dd);
if((p.startDate&&ds<p.startDate)||isHol(ds)||cfg.offDays.includes(String(dd.getDay()))||pres.has(ds)||lv.some(l=>l.email==p.email&&ds>=l.from&&ds<=(l.to||l.from)))continue;abs++}
if(cfg.prorata=='1')cut=abs*rt/div}
const aj=adj.find(x=>x.id==PM+'_'+p.email)||{amt:0},mine=its.filter(x=>x.email==p.email),at=(aj.amt||0)+mine.reduce((n,x)=>n+(+x.amt||0),0),notes=[aj.note,...mine.map(x=>x.note)].filter(Boolean).join('; ');
return {p,t,S,E,c,h,d,n:a.length,div,abs,cut,base,at,notes,rt,tot:base-cut+at}});
const H=['Nama','Tipe','Cut off','Periode','Jam','Hari','Shift','Tidak masuk','Gaji dasar','Potongan prorata','Penyesuaian','Total',''];
m.innerHTML=`<div class=card><label>Bulan payroll<input type=month id=pm value="${PM}"></label>${tbl(H,rows.map(r=>[esc(r.p.name),PL[r.t],esc(r.c?.name||'Default tgl 25'),r.S+' s/d '+r.E,r.h.toFixed(1),r.d,r.t=='shift'?`${r.n} × ${fr(r.rt/r.div)}`:r.n,r.t=='month'?r.abs+' hari':'-',fr(r.base),r.cut?'-'+fr(r.cut):'-',fr(r.at)+(r.notes?' ('+esc(r.notes)+')':''),'<b>'+fr(r.tot)+'</b>',`<button data-a="${esc(r.p.email)}">+ Penyesuaian</button>`]))}</div>`;
$('#pm').onchange=x=>{PM=x.target.value;adminUI()};m.insertAdjacentHTML('afterbegin','<button id=ex>Export CSV</button>');
$('#ex').onclick=()=>csv('payroll-'+PM,['Nama','Tipe','Cut off','Periode','Jam','Hari','Shift','Hari tidak masuk','Gaji dasar','Potongan prorata','Penyesuaian','Catatan','Total'],rows.map(r=>[r.p.name,PL[r.t],r.c?.name||'Default tgl 25',r.S+' s/d '+r.E,r.h.toFixed(1),r.d,r.n,r.t=='month'?r.abs:'',Math.round(r.base),Math.round(r.cut),Math.round(r.at),r.notes,Math.round(r.tot)]));
m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const o=await form('Penyesuaian payroll',[['amt','Bonus (+) / potongan (-) Rp','number'],['note','Catatan']]);
if(o){await setDoc(doc(collection(db,'adjItems')),{...o,period:PM,email:b.dataset.a});adminUI()}})},

const cfg={fixedDiv:0,offDays:[],prorata:'1',...(c0.exists()?c0.data():{})},nm=e=>esc(st.find(s=>s.email==e)?.name||e),se=[...st].map(s=>[s.email,s.name]);

$('#h3').innerHTML=`<h3>Penyesuaian gaji</h3><label>Bulan payroll<input type=month id=pm2 value="${PM}"></label>`;$('#pm2').onchange=x=>{PM=x.target.value;adminUI()};
await manage($('#h3'),{c:'adjItems',t:'Penyesuaian',head:['Staff','Catatan','Jumlah',''],rows:its,f:[['email','Staff','select',se],['amt','Bonus (+) / potongan (-) Rp','number'],['note','Catatan']],cols:r=>[nm(r.email),esc(r.note),fr(r.amt||0)],pre:(o,r)=>{if(!r)o.period=PM}})}
};
