<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi</title>
<style>
:root{--t:#111;--m:#6b7280;--y:#facc15;--b:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#fff;color:var(--t)}
#app{max-width:520px;margin:auto;padding:14px}#app.w{max-width:1000px}
.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:14px;margin:10px 0}.big{box-shadow:0 8px 30px #0001}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs{flex-wrap:nowrap;overflow-x:auto}.tabs button{white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,button{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--b);background:#fff;color:var(--t);width:100%;margin:4px 0}
button{cursor:pointer;width:auto;font-weight:600}.row button{flex:1}
button.p{background:var(--y);border-color:var(--y);color:#111}button.on{background:#111;border-color:#111;color:#fff}button:disabled{opacity:.4}
label{display:block;color:var(--m);font-size:13px;margin-top:6px}
.ck{display:flex;align-items:center;gap:8px;color:var(--t);font-size:14px}.ck input{width:auto;margin:0}
.chk{max-height:130px;overflow:auto;border:1px solid var(--b);border-radius:12px;padding:4px 10px}
.top{display:flex;align-items:center;gap:12px}.top small{color:var(--m)}
.av{width:46px;height:46px;border-radius:50%;padding:0;background:var(--y);border:2px solid #111;font-size:18px;margin:0}
.hi{text-align:center;margin:18px 0 6px}.hi h2{margin:0;font-size:24px}.hi p{margin:4px 0;color:var(--m)}
.clk{font-size:34px;font-weight:800}#dt{color:var(--m)}
video{width:100%;max-height:240px;object-fit:cover;background:#000;border-radius:14px;transform:scaleX(-1);margin-top:10px}
.kv{padding:7px 0;border-bottom:1px solid var(--b)}.kv small{color:var(--m)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
.err{color:#dc2626}.ok{color:#16a34a}img.t{width:44px;border-radius:6px}
dialog{max-height:90vh;overflow:auto;border:1px solid var(--b);border-radius:16px;background:#fff;color:var(--t);width:min(440px,94vw)}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script></head><body><div id="app">Memuat…</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,query} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
import {where} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBhjjjooVet5-2xZW2wnV3M0bRQJwSrVtU",authDomain:"absensi-9a933.firebaseapp.com",projectId:"absensi-9a933",storageBucket:"absensi-9a933.firebasestorage.app",messagingSenderId:"1000007340641",appId:"1:1000007340641:web:80698cab06303577b59020"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),view=h=>$('#app').innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=async(c,...w)=>(await getDocs(w.length?query(collection(db,c),...w):collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fmtD=d=>d.toLocaleDateString('sv'),fr=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const hrs=h=>h.inAt&&h.outAt?(new Date(h.outAt)-new Date(h.inAt))/36e5:0;
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742e3*Math.asin(Math.sqrt(x))};
const tbl=(h,r)=>`<div class=sc><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</table></div>`;
const opts=(a,v)=>a.map(x=>`<option value="${esc(x[0])}"${x[0]==v?' selected':''}>${esc(x[1])}</option>`).join('');
let me,em,tab='staff',PM,FS='';
window.out=()=>signOut(auth);
const bar=()=>`<div class="card bar"><b>Absensi</b><span>${esc(me?.name)} · ${me?.role||''}</span><button onclick="out()">Keluar</button></div>`;

const form=(title,fields,v={},extra='')=>new Promise(r=>{const d=document.createElement('dialog');
d.innerHTML=`<form method=dialog><h3>${title}</h3>${fields.map(([k,l,t,o])=>t=='check'?`<label>${l}</label><div class=chk>${o.map(x=>`<label class=ck><input type=checkbox name=${k} value="${esc(x[0])}"${(v[k]||[]).includes(x[0])?' checked':''}> ${esc(x[1])}</label>`).join('')||'<small>Belum ada data</small>'}</div>`:t=='map'?`<label>${l}</label><div class=row><input id=q placeholder="Cari tempat atau tempel link Google Maps"><button type=button id=sq>Cari</button><button type=button id=me2>Lokasi saya</button></div><div id=mp style="height:250px;border-radius:10px;margin:6px 0"></div><input type=hidden name=lat value="${v.lat??''}"><input type=hidden name=lng value="${v.lng??''}">`:`<label>${l}${t=='select'?`<select name=${k}>${opts(o,v[k])}</select>`:`<input name=${k} type="${t||'text'}" step=any value="${esc(v[k])}">`}</label>`).join('')}${extra}<div class=row><button value=x>Batal</button><button value=ok class=p>Simpan</button></div></form>`;
document.body.append(d);d.showModal();if(fields.some(f=>f[2]=='map'))mapInit(d);
d.onclose=()=>{let o=null;if(d.returnValue=='ok'){o={};const fd=new FormData(d.querySelector('form'));fd.forEach((x,k)=>o[k]=x);fields.forEach(f=>f[2]=='check'&&(o[f[0]]=fd.getAll(f[0])));fields.forEach(f=>f[2]=='number'&&(o[f[0]]=+o[f[0]]||0));if('lat'in o){o.lat=+o.lat||0;o.lng=+o.lng||0}}d.remove();r(o)}});
document.addEventListener('click',e=>{if(e.target.id=='gps')navigator.geolocation.getCurrentPosition(p=>{const f=e.target.form;f.lat.value=p.coords.latitude;f.lng.value=p.coords.longitude},x=>alert(x.message))});

const mapInit=async d=>{const f=d.querySelector('form'),ll=f.lat,lg=f.lng,box=d.querySelector('#mp');
box.textContent='Memuat peta…';
try{
if(!window.L){const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';document.head.append(css);
for(const u of['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js']){if(window.L)break;await new Promise(ok=>{const s=document.createElement('script');s.src=u;s.onload=s.onerror=ok;document.head.append(s)})}}
let m,mk,ci;const rad=()=>+f.radius?.value||100;
if(window.L){box.textContent='';m=L.map(box).setView([+ll.value||-7.5666,+lg.value||110.8167],ll.value?17:13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
m.on('click',e=>put(e.latlng.lat,e.latlng.lng));setTimeout(()=>m.invalidateSize(),200);
f.radius?.addEventListener('input',()=>ci&&ci.setRadius(rad()))}
else box.innerHTML='<p class=err>Peta gagal dimuat (cek koneksi atau ad blocker). Tetap bisa pakai pencarian atau tempel link Google Maps.</p>';
const put=(a,b,z)=>{ll.value=a;lg.value=b;
if(!m){box.innerHTML=`<p class=ok>Titik terpilih: ${(+a).toFixed(5)}, ${(+b).toFixed(5)}</p>`;return}
mk?mk.setLatLng([a,b]):mk=L.marker([a,b]).addTo(m);ci?ci.setLatLng([a,b]).setRadius(rad()):ci=L.circle([a,b],{radius:rad()}).addTo(m);z&&m.setView([a,b],z)};
if(ll.value)put(+ll.value,+lg.value);
const go=async()=>{const q=d.querySelector('#q').value.trim();if(!q)return;
const g=q.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||q.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||q.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
if(g)return put(+g[1],+g[2],17);
try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();
r[0]?put(+r[0].lat,+r[0].lon,17):alert('Tempat tidak ditemukan')}catch(e){alert('Pencarian gagal: '+e.message)}};
d.querySelector('#sq').onclick=go;d.querySelector('#q').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();go()}};
d.querySelector('#me2').onclick=()=>navigator.geolocation.getCurrentPosition(p=>put(p.coords.latitude,p.coords.longitude,17),x=>alert(x.message))
}catch(e){box.innerHTML='<p class=err>Peta error: '+String(e.message).replace(/</g,'&lt;')+'</p>'}};

/* LOGIN */
function loginUI(){view(`<div class=card style="max-width:360px;margin:10vh auto"><h2>Absensi</h2><input id=em type=email placeholder=Email><input id=pw type=password placeholder=Password><div class=row><button class=p id=li>Masuk</button><button id=su>Daftar</button></div><button id=go style="width:100%">Masuk dengan Google</button><p id=er class=err></p></div>`);
const run=f=>f().catch(e=>$('#er').textContent=e.message);
$('#li').onclick=()=>run(()=>signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value));
$('#su').onclick=()=>run(()=>createUserWithEmailAndPassword(auth,$('#em').value,$('#pw').value));
$('#go').onclick=()=>run(()=>signInWithPopup(auth,new GoogleAuthProvider()))}

onAuthStateChanged(auth,async u=>{
if(!u){me=null;return loginUI()}
try{em=u.email.toLowerCase();let d=await getDoc(doc(db,'staff',em));
if(!d.exists()){if((await list('staff',where('role','==','admin'))).length){view(bar()+`<div class=card>Akun <b>${esc(em)}</b> belum didaftarkan admin.</div>`);return}
await setDoc(doc(db,'staff',em),{name:u.displayName||em,email:em,role:'admin',payType:'hour',rate:0});d=await getDoc(doc(db,'staff',em))}
me=d.data();me.role=='admin'?adminUI():staffUI()}catch(e){view(bar()+`<div class="card err">${esc(e.message)}</div>`)}});

/* STAFF */
async function staffUI(){
const [locs,shs,tasks,hist]=await Promise.all([list('locations'),list('shifts'),list('tasks',where('email','==',em)),list('attendance',where('email','==',em))]);
hist.sort((a,b)=>(b.inAt||'').localeCompare(a.inAt||''));
const open=hist.find(h=>h.inAt&&!h.outAt);
$('#app').className='';
const pick=(a,ids)=>ids.length?a.filter(x=>ids.includes(x.id)):a;
const L2=pick(locs,me.locIds||(me.locId?[me.locId]:[])),S2=pick(shs,me.shiftIds||(me.shiftId?[me.shiftId]:[])),nt=tasks.filter(t=>!t.done).length;
view(`<div class=top><button class=av id=pf>${esc((me.name||'?')[0].toUpperCase())}</button><div><b>${esc(me.name)}</b><br><small>${esc(me.position||'Staff')}</small></div></div>
<div class=hi><h2>Halo 👋 ${esc((me.name||'').split(' ')[0])}</h2><p>Semangat kerja ya!</p></div>
<div class="card big"><div id=clk class=clk></div><div id=dt></div><video id=v autoplay playsinline muted></video><canvas id=cv hidden></canvas>
<div class=two><label>Lokasi<select id=lo>${opts(L2.map(l=>[l.id,l.name]),open?.locId)}</select></label><label>Shift<select id=sh>${opts(S2.map(s=>[s.id,`${s.name} (${s.start}-${s.end})`]),open?.shiftId)}</select></label></div>
<div class=row><button class=p id=bi ${open?'disabled':''}>Masuk</button><button id=bo ${open?'':'disabled'}>Keluar</button></div><p id=st></p></div>
<div class=row><button id=tg>Tugas${nt?` (${nt})`:''}</button><button id=rw>Riwayat Absen</button></div><div id=pn></div>`);
clearInterval(window.ck);const tick=()=>{const e=$('#clk');if(!e)return clearInterval(window.ck);const n=new Date();e.textContent=n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':')+' WIB';$('#dt').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};tick();window.ck=setInterval(tick,1000);
navigator.mediaDevices?.getUserMedia({video:{facingMode:'user'}}).then(s=>$('#v').srcObject=s).catch(()=>$('#st').textContent='Kamera tidak bisa diakses');
let sec='';const pane=k=>{sec=sec==k?'':k;const p=$('#pn');
p.innerHTML=sec=='t'?`<div class=card>${tasks.map(t=>`<label class=ck><input type=checkbox data-k="${t.id}" ${t.done?'checked':''}> ${esc(t.text)}</label>`).join('')||'<p>Tidak ada tugas.</p>'}</div>`:sec=='r'?`<div class=card>${tbl(['Tanggal','Shift','Lokasi','Masuk','Keluar','Jam'],hist.map(h=>[h.date,esc(h.shiftName),esc(h.locName),(h.inAt||'').slice(11),(h.outAt||'').slice(11),hrs(h).toFixed(1)]))}</div>`:'';
p.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>setDoc(doc(db,'tasks',c.dataset.k),{done:c.checked},{merge:true}));
$('#tg').classList.toggle('on',sec=='t');$('#rw').classList.toggle('on',sec=='r')};
$('#tg').onclick=()=>pane('t');$('#rw').onclick=()=>pane('r');
$('#pf').onclick=()=>{const d=document.createElement('dialog'),P=[['Nama lengkap',me.name],['Email',me.email],['No HP',me.phone],['NIK',me.nik],['Jenis kelamin',{L:'Laki-laki',P:'Perempuan'}[me.gender]],['Tempat, tanggal lahir',[me.birthPlace,me.birthDate].filter(Boolean).join(', ')],['Alamat',me.address],['Kontak darurat',me.emergency],['Mulai bekerja',me.startDate],['Posisi',me.position],['Lokasi kerja',L2.map(x=>x.name).join(', ')],['Shift',S2.map(x=>`${x.name} (${x.start}-${x.end})`).join(', ')]];
d.innerHTML=`<h3>Profil saya</h3>${P.map(([k,x])=>`<div class=kv><small>${k}</small><div>${esc(x)||'-'}</div></div>`).join('')}<div class=row><button id=x1>Tutup</button><button class=on onclick="out()">Keluar akun</button></div>`;
document.body.append(d);d.showModal();d.querySelector('#x1').onclick=()=>d.close();d.onclose=()=>d.remove()};
const act=async k=>{const st=$('#st');st.className='';try{
st.textContent='Mengambil lokasi…';
const p=await new Promise((a,b)=>navigator.geolocation.getCurrentPosition(a,b,{enableHighAccuracy:true,timeout:15000}));
const l=locs.find(x=>x.id==$('#lo').value),sh=shs.find(x=>x.id==$('#sh').value);if(!l||!sh)throw Error('Pilih lokasi dan shift');
const dist=Math.round(hav(p.coords.latitude,p.coords.longitude,l.lat,l.lng));
if(dist>l.radius)throw Error(`Di luar radius: ${dist} m dari ${l.name} (maks ${l.radius} m)`);
const v=$('#v'),cv=$('#cv');if(!v.videoWidth)throw Error('Kamera belum siap');
cv.width=320;cv.height=v.videoHeight/v.videoWidth*320;cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
const photo=cv.toDataURL('image/jpeg',.5),now=nowL();
if(k=='in')await setDoc(doc(db,'attendance',`${em}_${now.slice(0,10)}_${sh.id}`),{email:em,name:me.name,date:now.slice(0,10),shiftId:sh.id,shiftName:sh.name,locId:l.id,locName:l.name,inAt:now,inPhoto:photo,inDist:dist,outAt:''});
else await setDoc(doc(db,'attendance',open.id),{outAt:now,outPhoto:photo,outDist:dist},{merge:true});
staffUI()}catch(e){st.className='err';st.textContent=e.message}};
$('#bi').onclick=()=>act('in');$('#bo').onclick=()=>act('out')}

/* ADMIN */
const TL={staff:'Staff',absensi:'Absensi',shifts:'Shift',locations:'Lokasi',positions:'Posisi',tasks:'Tugas',payroll:'Payroll'};
async function adminUI(){$('#app').className='w';
view(bar()+`<div class=tabs>${Object.entries(TL).map(([k,l])=>`<button data-t=${k} class="${k==tab?'p':''}">${l}</button>`).join('')}</div><div id=main></div>`);
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;adminUI()});
try{await TABS[tab]($('#main'))}catch(e){$('#main').innerHTML=`<p class=err>${esc(e.message)}</p>`}}

async function manage(m,{c,t,f,rows,cols,head,id,pre,def={}}){
m.insertAdjacentHTML('beforeend',`<p><button class=p id=ad>+ Tambah ${t}</button></p><div class=card>${tbl(head,rows.map(r=>[...cols(r),`<button data-e="${r.id}">Edit</button> <button data-d="${r.id}">Hapus</button>`]))}</div>`);
const sv=async r=>{const o=await form(t,f,r||def);if(!o)return;pre&&pre(o,r);
await setDoc(doc(db,c,id?id(o,r):(r?r.id:doc(collection(db,c)).id)),o,{merge:true});adminUI()};
m.querySelector('#ad').onclick=()=>sv();
m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>sv(rows.find(r=>r.id==b.dataset.e)));
m.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus data ini?')){await deleteDoc(doc(db,c,b.dataset.d));adminUI()}})}

const PT=[['hour','Per jam'],['day','Per hari'],['shift','Per shift']];
const TABS={
async staff(m){const [rows,pos,sh,lo]=await Promise.all([list('staff'),list('positions'),list('shifts'),list('locations')]);
const nm=(a,i)=>esc(a.find(x=>x.id==i)?.name);
await manage(m,{c:'staff',t:'Staff',head:['Nama lengkap','No HP','Email','NIK','Tempat, tgl lahir','Alamat','Posisi','Lokasi','Shift','Mulai kerja','Role','Gaji','Tipe',''],rows,
f:[['name','Nama lengkap'],['phone','No HP','tel'],['email','Email','email'],['nik','NIK'],['gender','Jenis kelamin','select',[['','-'],['L','Laki-laki'],['P','Perempuan']]],['birthPlace','Tempat lahir'],['birthDate','Tanggal lahir','date'],['address','Alamat tempat tinggal'],['emergency','Kontak darurat (nama & no HP)'],['startDate','Mulai bekerja','date'],['role','Role','select',[['staff','Staff'],['admin','Admin']]],['position','Posisi','select',[['','-'],...pos.map(p=>[p.name,p.name])]],['locIds','Lokasi kerja (boleh lebih dari satu)','check',lo.map(l=>[l.id,l.name])],['shiftIds','Shift (boleh lebih dari satu)','check',sh.map(s=>[s.id,s.name])],['payType','Tipe gaji','select',PT],['rate','Gaji (Rp)','number']],
cols:r=>[esc(r.name),esc(r.phone),esc(r.email),esc(r.nik),esc([r.birthPlace,r.birthDate].filter(Boolean).join(', ')),esc(r.address),esc(r.position),(r.locIds||[r.locId]).map(i=>nm(lo,i)).filter(Boolean).join(', '),(r.shiftIds||[r.shiftId]).map(i=>nm(sh,i)).filter(Boolean).join(', '),r.startDate||'',r.role,fr(r.rate||0),(PT.find(x=>x[0]==r.payType)||[])[1]||''],
id:(o,r)=>r?r.id:o.email.toLowerCase(),pre:(o,r)=>{if(!r)o.email=o.email.toLowerCase()},def:{role:'staff',payType:'hour'}})},
async absensi(m){const [st,sh,all]=await Promise.all([list('staff'),list('shifts'),list('attendance')]);
m.innerHTML=`<select id=fs><option value="">Semua staff</option>${opts(st.map(s=>[s.email,s.name]),FS)}</select>`;
$('#fs').onchange=e=>{FS=e.target.value;adminUI()};
const rows=all.filter(a=>!FS||a.email==FS).sort((a,b)=>(b.inAt||'').localeCompare(a.inAt||'')).slice(0,200);
const img=s=>s?`<img class=t src="${s}">`:'';
await manage(m,{c:'attendance',t:'Absensi',head:['Tanggal','Nama','Shift','Lokasi','Datang','Pulang','Jam','Foto',''],rows,
f:[['email','Staff','select',st.map(s=>[s.email,s.name])],['shiftId','Shift','select',sh.map(s=>[s.id,s.name])],['inAt','Datang','datetime-local'],['outAt','Pulang','datetime-local']],
cols:r=>[r.date,esc(r.name),esc(r.shiftName),esc(r.locName),(r.inAt||'').slice(11),(r.outAt||'').slice(11),hrs(r).toFixed(1),img(r.inPhoto)+img(r.outPhoto)],
id:(o,r)=>r?r.id:`${o.email}_${o.inAt.slice(0,10)}_${o.shiftId}`,
pre:o=>{o.date=o.inAt.slice(0,10);o.name=st.find(s=>s.email==o.email)?.name;o.shiftName=sh.find(s=>s.id==o.shiftId)?.name},def:{inAt:nowL()}})},
async shifts(m){const rows=await list('shifts');await manage(m,{c:'shifts',t:'Shift',head:['Nama','Mulai','Selesai',''],rows,f:[['name','Nama shift'],['start','Jam mulai','time'],['end','Jam selesai','time']],cols:r=>[esc(r.name),r.start,r.end]})},

async payroll(m){const cfg=(await getDoc(doc(db,'settings','payroll'))).data()||{cutoff:25},co=cfg.cutoff;
PM=PM||nowL().slice(0,7);const [y,mm]=PM.split('-').map(Number);
const end=(Y,M)=>new Date(Y,M,Math.min(co,new Date(Y,M+1,0).getDate()));
const e=end(y,mm-1),s=new Date(end(y,mm-2).getTime()+864e5),S=fmtD(s),E=fmtD(e);
const [st,att,adj]=await Promise.all([list('staff'),list('attendance'),list('adjust')]);
const rows=st.map(p=>{const a=att.filter(x=>x.email==p.email&&x.date>=S&&x.date<=E&&x.outAt),h=a.reduce((n,x)=>n+hrs(x),0),d=new Set(a.map(x=>x.date)).size;
const base=(p.payType=='day'?d:p.payType=='shift'?a.length:h)*(p.rate||0),aj=adj.find(x=>x.id==PM+'_'+p.email)||{amt:0};
return {p,h,d,n:a.length,base,aj,tot:base+(aj.amt||0)}});
m.innerHTML=`<div class=card><div class=row><label>Bulan payroll<input type=month id=pm value="${PM}"></label><label>Tanggal cut off<input type=number id=co min=1 max=31 value="${co}"></label><button id=sc>Simpan cut off</button></div><p>Periode: <b>${S}</b> s/d <b>${E}</b></p>
${tbl(['Nama','Jam','Hari','Shift','Gaji dasar','Penyesuaian','Total',''],rows.map(r=>[esc(r.p.name),r.h.toFixed(1),r.d,r.n,fr(r.base),fr(r.aj.amt||0)+(r.aj.note?' ('+esc(r.aj.note)+')':''),'<b>'+fr(r.tot)+'</b>',`<button data-a="${esc(r.p.email)}">Edit</button>`]))}</div>`;
$('#pm').onchange=x=>{PM=x.target.value;adminUI()};
$('#sc').onclick=async()=>{await setDoc(doc(db,'settings','payroll'),{cutoff:+$('#co').value||25});adminUI()};
m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const k=PM+'_'+b.dataset.a,o=await form('Penyesuaian payroll',[['amt','Bonus (+) / potongan (-) Rp','number'],['note','Catatan']],adj.find(x=>x.id==k)||{});
if(o){await setDoc(doc(db,'adjust',k),{...o,period:PM,email:b.dataset.a});adminUI()}})}
};
